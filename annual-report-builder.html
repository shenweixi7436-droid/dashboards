<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>年度汇报编排工具</title>
<style>
@font-face{font-family:HKYuanW7;src:url('./fonts/华康圆体-W7.ttf') format('truetype');font-display:swap}

:root{

button,input,textarea,select{font:inherit}

.app{height:100%;display:grid;grid-template-columns:250px minmax(0,1fr) 310px;grid-template-rows:60px minmax(0,1fr)}
.topbar{grid-column:1/-1;display:flex;align-items:center;gap:18px;padding:0 18px;background:var(--coffee);color:#fff;box-shadow:0 4px 16px rgba(62,34,20,.18);z-index:4}
.brand{display:flex;align-items:center;gap:10px;width:232px;min-width:232px}

.brand strong{font:17px/1 HKYuanW9,'Microsoft YaHei',sans-serif}
.brand small{display:block;margin-top:5px;color:#eccda9;font-size:9px}
.toolbar{flex:1;display:flex;align-items:center;gap:10px;min-width:0}

.toolbar-spacer{flex:1}

.btn{height:34px;flex:0 0 auto;padding:0 13px;border:1px solid transparent;border-radius:4px;background:#fff;color:var(--coffee);font-size:11px;font-weight:800;white-space:nowrap;transition:.15s ease}
.btn:hover{transform:translateY(-1px);box-shadow:0 5px 12px rgba(0,0,0,.14)}
.btn-primary{background:var(--yellow);color:var(--coffee)}
.btn-ghost{border-color:rgba(255,255,255,.3);background:transparent;color:#fff}

.sidebar{grid-column:1;grid-row:2;display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line);background:var(--surface)}

.side-title{font:13px/1 HKYuanW9,'Microsoft YaHei',sans-serif}

.page-list{flex:1;min-height:0;overflow:auto;padding:2px 10px 12px}

.page-item:hover{border-color:#cdbba9;background:#fff}
.page-item.active{border-color:var(--yellow);background:#fff8d9;box-shadow:0 0 0 2px rgba(247,201,0,.15)}
.page-index{color:var(--red);font:9px/1 GothamRounded,HKYuanW9,sans-serif}
.page-name{margin-top:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:12px/1.25 HKYuanW8,'Microsoft YaHei',sans-serif}
.page-module{margin-top:5px;color:var(--muted);font-size:9px}
.page-actions{position:absolute;right:6px;top:6px;display:flex;flex-direction:column;gap:4px}
.icon-btn{width:23px;height:23px;padding:0;border:1px solid var(--line);border-radius:3px;background:#fff;color:var(--muted);font-size:14px;line-height:20px}
.icon-btn:hover{border-color:var(--red);color:var(--red)}
.add-page{margin:0 10px 12px;height:38px;border:1px dashed #bba38f;border-radius:5px;background:#fff;color:var(--coffee);font-size:11px;font-weight:800}
.workspace{grid-column:2;grid-row:2;min-width:0;min-height:0;display:flex;align-items:center;justify-content:center;overflow:auto;padding:24px;background:radial-gradient(circle at 50% 35%,#faf7f2 0,#e9e0d6 65%,#ded3c7 100%)}
.canvas-shell{position:relative;width:min(100%,1200px);aspect-ratio:16/9;flex:0 0 auto;box-shadow:0 20px 60px rgba(52,28,15,.2);background:var(--paper)}
.report-canvas{position:absolute;inset:0;overflow:hidden;background:var(--paper)}

.form{padding:14px 16px 24px}
.field{display:block;margin-bottom:14px}
.field span{display:block;margin-bottom:6px;color:var(--muted);font-size:10px;font-weight:700}
.field input,.field textarea{width:100%;border:1px solid var(--line);border-radius:4px;background:#fff;padding:9px 10px;color:var(--text);font-size:11px;line-height:1.5;outline:none;resize:vertical}
.field input:focus,.field textarea:focus{border-color:var(--yellow);box-shadow:0 0 0 3px rgba(247,201,0,.14)}
.field textarea{min-height:76px}
.field textarea.short{min-height:58px}
.section-label{margin:4px 0 12px;padding-top:14px;border-top:1px solid var(--line-soft);font:11px/1 HKYuanW9,'Microsoft YaHei',sans-serif}
.danger-btn{width:100%;height:35px;border:1px solid #efb8ad;border-radius:4px;background:#fff;color:var(--red);font-size:10px;font-weight:800}
.inline-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.secondary-btn{height:34px;border:1px solid var(--line);border-radius:4px;background:#fff;color:var(--coffee);font-size:10px;font-weight:800}.secondary-btn:hover{border-color:var(--yellow);background:#fff9dd}
.element-inspector{display:none}.element-inspector.show{display:block}.selected-name{margin-bottom:12px;padding:9px 10px;border-left:3px solid var(--yellow);background:#fff8d8;color:var(--coffee);font:11px/1.4 HKYuanW8,sans-serif}.field-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.field.compact{margin-bottom:10px}.field.compact input,.field.compact select{width:100%;height:34px;padding:0 8px;border:1px solid var(--line);border-radius:4px;background:#fff;color:var(--text);font-size:10px;outline:none}.field.compact input[type="color"]{padding:3px}.field.compact input:focus,.field.compact select:focus{border-color:var(--yellow);box-shadow:0 0 0 3px rgba(247,201,0,.14)}
.toggle-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}.toggle-field{display:flex;align-items:center;gap:8px;min-height:34px;padding:7px 9px;border:1px solid var(--line);border-radius:4px;background:#fff;color:var(--muted);font-size:10px;font-weight:700}.toggle-field input{width:15px;height:15px;margin:0;accent-color:var(--red)}

/* 16:9 report page */
.rpt-header{height:11%;padding:0 2.3%;display:flex;align-items:center;justify-content:space-between;color:#fff;background:var(--coffee);background-image:repeating-linear-gradient(135deg,transparent 0 32px,rgba(255,255,255,.035) 32px 34px)}
.rpt-brand{display:flex;align-items:center;gap:10px}.rpt-brand img{width:50px;height:50px;object-fit:contain}.rpt-brand strong{font:18px/1 HKYuanW9,'Microsoft YaHei',sans-serif}.rpt-brand small{display:block;margin-top:5px;color:#f0d5b8;font-size:8px}
.rpt-header-code{text-align:right}.rpt-header-code b{display:block;color:var(--yellow);font:14px/1 GothamRounded,HKYuanW9,sans-serif}.rpt-header-code span{display:block;margin-top:6px;color:#ecd5c0;font-size:8px}
.rpt-body{position:relative;height:89%;padding:0;overflow:hidden}
.rpt-heading{height:8%;display:flex;align-items:flex-start;justify-content:space-between;gap:18px}.rpt-eyebrow{color:var(--red);font:9px/1 HKYuanW8,sans-serif}.rpt-title{margin-top:5px;font:21px/1 HKYuanW9,sans-serif}.rpt-summary{width:48%;margin:2px 0 0;text-align:right;color:var(--muted);font:10px/1.5 HKYuanW8,sans-serif}.rpt-summary b{color:var(--red)}
.rpt-kpis{height:15%;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1%}.rpt-kpi{position:relative;padding:10px 12px;border:1px solid #e6d8cb;border-top:3px solid var(--coffee);border-radius:4px;background:#fff}.rpt-kpi:nth-child(2){border-top-color:var(--yellow)}.rpt-kpi:nth-child(3){border-top-color:var(--coral)}.rpt-kpi:nth-child(4){border-top-color:var(--red)}.rpt-kpi-label{color:var(--muted);font:9px/1 HKYuanW8,sans-serif}.rpt-kpi-value{margin-top:7px;color:var(--coffee);font:24px/1 GothamRounded,HKYuanW9,sans-serif}.rpt-kpi:nth-child(2) .rpt-kpi-value{color:#bb9300}.rpt-kpi:nth-child(3) .rpt-kpi-value{color:var(--coral)}.rpt-kpi:nth-child(4) .rpt-kpi-value{color:var(--red)}.rpt-kpi-value small{margin-left:2px;font:9px/1 HKYuanW8,sans-serif}.rpt-kpi-note{position:absolute;right:10px;bottom:8px;color:#8f7b70;font-size:7px}
.rpt-main{height:43%;display:grid;grid-template-columns:minmax(0,2.2fr) minmax(260px,.9fr);gap:1%}.rpt-panel{min-width:0;border:1px solid #e4d6c9;border-radius:4px;background:#fff}.rpt-chart-panel{padding:10px 12px 7px;display:flex;flex-direction:column}.rpt-panel-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;min-height:28px}.rpt-panel-title{font:12px/1.2 HKYuanW9,sans-serif}.rpt-panel-sub{margin-top:4px;color:var(--muted);font-size:7px}.rpt-legend{display:flex;gap:10px;color:var(--muted);font-size:7px;white-space:nowrap}.rpt-legend span{display:flex;align-items:center;gap:4px}.rpt-legend i{display:block;width:10px;height:5px;border-radius:1px;background:var(--coffee)}.rpt-legend i.line{height:2px;background:var(--red)}.chart-host{flex:1;min-height:0}.chart-host svg{width:100%;height:100%;display:block}
.rpt-analysis{padding:12px 14px;display:flex;flex-direction:column;background:linear-gradient(150deg,#fff 0,#fff8db 100%)}.rpt-analysis-kicker{color:var(--red);font:8px/1 HKYuanW8,sans-serif}.rpt-analysis-title{margin-top:6px;font:16px/1.25 HKYuanW9,sans-serif}.rpt-analysis-lead{margin-top:9px;padding:8px 9px;border-left:3px solid var(--yellow);background:#fff;font:9px/1.5 HKYuanW8,sans-serif}.rpt-analysis-list{margin:9px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}.rpt-analysis-list li{position:relative;padding-left:10px;color:#665044;font-size:7.5px;line-height:1.45}.rpt-analysis-list li::before{content:"";position:absolute;left:0;top:4px;width:4px;height:4px;border-radius:50%;background:var(--red)}.rpt-analysis-list b{color:var(--coffee)}.rpt-recommend{margin-top:auto;padding-top:8px;border-top:1px solid #eadfd4}.rpt-recommend b{display:block;font:8px/1 HKYuanW9,sans-serif}.rpt-recommend p{margin:5px 0 0;color:var(--muted);font-size:7px;line-height:1.4}
.rpt-secondary{height:24%;padding:9px 12px 7px;display:flex;flex-direction:column}.compact-chart{flex:1;min-height:0}.compact-chart svg{width:100%;height:100%;display:block}.rpt-footer{height:3%;display:flex;align-items:flex-end;justify-content:space-between;color:#9a887c;font-size:7px}.rpt-page-num{color:var(--coffee);font:9px/1 GothamRounded,sans-serif}
.empty-canvas{height:100%;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px}
.editable-element{position:absolute;min-width:28px;min-height:20px;user-select:none;touch-action:none}.editable-element:hover{outline:1px dashed rgba(217,57,36,.55);outline-offset:2px}.editable-element.selected{outline:2px solid var(--red);outline-offset:2px;z-index:50!important}.editable-element.dragging{cursor:grabbing}.editable-element[data-type="text"]{overflow:hidden}.editable-text{width:100%;height:100%;overflow:hidden;white-space:pre-wrap}.editable-element[data-type="text"] .rpt-title{margin:0;font-size:inherit;color:inherit;text-align:inherit}.editable-element[data-type="text"] .rpt-summary{width:100%;height:100%;margin:0;font-size:inherit;color:inherit;text-align:inherit}.editable-element[data-type="kpi"] .rpt-kpi{width:100%;height:100%;padding:10px 12px}.editable-element[data-type="kpi"] .rpt-kpi-value{font-size:var(--element-font-size,24px);color:var(--element-color,var(--coffee));text-align:var(--element-align,left)}.editable-element[data-type="chart"] .rpt-panel{width:100%;height:100%;background:var(--element-bg,#fff)}.editable-element[data-type="chart"] .rpt-panel-title{font-size:var(--element-font-size,12px);color:var(--element-color,var(--text));text-align:var(--element-align,left)}.editable-element[data-type="analysis"] .rpt-analysis{width:100%;height:100%;background:var(--element-bg,linear-gradient(150deg,#fff 0,#fff8db 100%))}.editable-element[data-type="analysis"] .rpt-analysis-title{font-size:var(--element-font-size,16px);color:var(--element-color,var(--text));text-align:var(--element-align,left)}
.editable-element[data-type="image"]{background:transparent!important}.report-image-frame{width:100%;height:100%;overflow:hidden;border:1px solid #e4d6c9;border-radius:4px;background:#fff}.report-image-frame img{display:block;width:100%;height:100%;object-position:center}
.resize-handle{position:absolute;display:none;width:9px;height:9px;border:1px solid #fff;border-radius:2px;background:var(--red);box-shadow:0 0 0 1px var(--red);z-index:5}.editable-element.selected .resize-handle{display:block}.resize-handle.nw{left:-6px;top:-6px;cursor:nwse-resize}.resize-handle.ne{right:-6px;top:-6px;cursor:nesw-resize}.resize-handle.sw{left:-6px;bottom:-6px;cursor:nesw-resize}.resize-handle.se{right:-6px;bottom:-6px;cursor:nwse-resize}
.rpt-fixed-footer{position:absolute;left:2.3%;right:2.3%;bottom:.7%;height:2.2%;display:flex;align-items:flex-end;justify-content:space-between;color:#9a887c;font-size:7px}.rpt-fixed-footer .rpt-page-num{color:var(--coffee);font:9px/1 GothamRounded,sans-serif}

.modal{display:none;position:fixed;inset:0;z-index:20;align-items:center;justify-content:center;padding:24px;background:rgba(45,24,13,.58)}
.modal.show{display:flex}.dialog{width:min(680px,94vw);padding:22px;border-radius:7px;background:#fff;box-shadow:0 24px 70px rgba(0,0,0,.28)}.dialog-head{display:flex;align-items:center;justify-content:space-between}.dialog-title{font:18px/1 HKYuanW9,sans-serif}.dialog-close{width:32px;height:32px;border:1px solid var(--line);border-radius:50%;background:#fff;color:var(--coffee);font-size:20px}.module-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:18px}.module-option{min-height:160px;padding:16px;border:1px solid var(--line);border-radius:6px;background:var(--surface-2);text-align:left;color:var(--text)}.module-option:hover{border-color:var(--yellow);background:#fff9dd;transform:translateY(-2px)}.module-no{color:var(--red);font:10px/1 GothamRounded,sans-serif}.module-name{margin-top:22px;font:16px/1 HKYuanW9,sans-serif}.module-desc{margin-top:9px;color:var(--muted);font-size:10px;line-height:1.55}
.library-dialog{width:min(1020px,96vw);max-height:88vh;display:flex;flex-direction:column}.dialog-note{margin-top:8px;color:var(--muted);font-size:10px;line-height:1.5}.library-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:18px;overflow:auto;padding:2px 4px 8px}.layout-option,.image-option{min-width:0;padding:10px;border:1px solid var(--line);border-radius:6px;background:#fff;text-align:left;color:var(--text);transition:.15s ease}.layout-option:hover,.image-option:hover{border-color:var(--yellow);box-shadow:0 7px 18px rgba(78,42,21,.12);transform:translateY(-2px)}.layout-option.active{border-color:var(--red);box-shadow:0 0 0 2px rgba(217,57,36,.12)}.layout-preview{position:relative;aspect-ratio:16/9;overflow:hidden;border-radius:4px;background:var(--paper);box-shadow:inset 0 0 0 1px #eadfd3}.layout-preview::before{content:"";position:absolute;left:0;right:0;top:0;height:12%;background:var(--coffee)}.layout-block{position:absolute;border-radius:2px;background:#fff;border:1px solid #dfd4ca}.layout-block.accent{border-top:3px solid var(--yellow)}.layout-block.chart{background:linear-gradient(180deg,#fff,#fff9e1)}.layout-name{margin-top:9px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:11px/1.2 HKYuanW9,sans-serif}.layout-source{margin-top:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);font-size:8px}.image-option{padding:7px}.image-thumb{display:flex;align-items:center;justify-content:center;aspect-ratio:4/3;overflow:hidden;border-radius:4px;background:repeating-conic-gradient(#f2eee9 0 25%,#fff 0 50%) 0/14px 14px}.image-thumb img{width:100%;height:100%;object-fit:contain}.image-name{margin-top:7px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:9px;font-weight:800}.image-meta{margin-top:3px;color:var(--muted);font-size:8px}.library-empty{grid-column:1/-1;padding:42px 20px;text-align:center;color:var(--muted);font-size:11px}
.ai-panel{position:fixed;right:326px;top:72px;bottom:16px;z-index:15;width:370px;display:flex;flex-direction:column;border:1px solid #cdbdab;border-radius:7px;background:#fff;box-shadow:0 18px 55px rgba(52,28,15,.24);opacity:0;pointer-events:none;transform:translateX(24px);transition:.2s ease}.ai-panel.show{opacity:1;pointer-events:auto;transform:none}.ai-head{height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-bottom:1px solid var(--line-soft);background:var(--coffee);color:#fff}.ai-title{font:14px/1 HKYuanW9,sans-serif}.ai-mode{margin-top:5px;color:#efd5b9;font-size:8px}.ai-close{width:29px;height:29px;border:1px solid rgba(255,255,255,.35);border-radius:50%;background:transparent;color:#fff;font-size:19px}.ai-messages{flex:1;min-height:0;overflow:auto;padding:14px;background:#f8f4ef}.ai-message{max-width:88%;margin-bottom:10px;padding:9px 11px;border-radius:6px;font-size:10px;line-height:1.55;white-space:pre-wrap}.ai-message.user{margin-left:auto;background:var(--coffee);color:#fff}.ai-message.assistant{border:1px solid #e7d9cc;background:#fff;color:var(--text)}.ai-message.error{border-color:#efb8ad;background:#fff2ef;color:var(--red)}.ai-suggestions{display:flex;gap:6px;padding:9px 10px;overflow-x:auto;border-top:1px solid var(--line-soft);background:#fff}.ai-suggestion{flex:0 0 auto;height:27px;padding:0 9px;border:1px solid #d8c7b7;border-radius:4px;background:#fff;color:var(--coffee);font-size:9px;font-weight:800}.ai-suggestion:hover{border-color:var(--yellow);background:#fff9dc}.ai-compose{display:grid;grid-template-columns:minmax(0,1fr) 66px;gap:8px;padding:10px;border-top:1px solid var(--line-soft);background:#fff}.ai-input{height:68px;padding:9px 10px;border:1px solid var(--line);border-radius:4px;resize:none;outline:none;color:var(--text);font-size:10px;line-height:1.45}.ai-input:focus{border-color:var(--yellow);box-shadow:0 0 0 3px rgba(247,201,0,.14)}.ai-send{border:0;border-radius:4px;background:var(--yellow);color:var(--coffee);font-size:10px;font-weight:900}.ai-send:disabled{opacity:.45;cursor:not-allowed}.ai-thinking{display:inline-block;width:10px;height:10px;border:2px solid #d6c6b7;border-top-color:var(--red);border-radius:50%;animation:aiSpin .7s linear infinite}@keyframes aiSpin{to{transform:rotate(360deg)}}

@media(max-width:1450px){.ai-panel{right:292px;width:340px}}
@media(max-width:800px){.app{grid-template-columns:minmax(0,1fr);grid-template-rows:54px minmax(0,1fr)}.topbar{grid-column:1;grid-row:1;gap:8px;padding:0 8px;overflow-x:auto}.brand,.toolbar-group,.save-state,#undoButton,#redoButton,#copyElementButton,#pasteElementButton,#duplicatePageButton{display:none}.toolbar{min-width:max-content;justify-content:flex-end}.toolbar-spacer{display:none}.sidebar,.inspector{display:none}.workspace{grid-column:1;grid-row:2;padding:8px;align-items:flex-start}.canvas-shell{width:100%;margin-top:10px}.library-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.modal{padding:10px}.library-dialog{max-height:92vh;padding:16px}.dialog-title{font-size:15px}}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <img src="./assets/images/tiger-header.png" alt="皇家小虎">
      <div><strong>年度汇报编排工具</strong><small>ANNUAL REPORT BUILDER</small></div>

  function ensurePageModel(page){
    if(!Array.isArray(page.elements)||!page.elements.length)page.elements=defaultElements(page);
    if(!page.layoutId)page.layoutId='current';
    page.elements.forEach(function(element){
      element.style=Object.assign({fontFamily:'HKYuanW7',fontSize:12,color:'#352016',background:'#ffffff',textAlign:'left',z:2},element.style||{});
      if(element.type==='chart')element.chartConfig=Object.assign({visual:'auto',metric:'value',sort:'source',topN:10,showLabels:true,showLegend:true,primaryColor:'#713618',secondaryColor:'#d93924',xAxisTitle:'',yAxisTitle:''},element.chartConfig||{});
      if(element.type==='image')element.fit=element.fit||'contain';
      element.x=n(element.x);element.y=n(element.y);element.w=Math.max(2,n(element.w));element.h=Math.max(2,n(element.h));
    });

  }

  function selectedElement(){var page=activePage();return page&&page.elements?page.elements.find(function(element){return element.id===selectedElementId;}):null;}
  function currentElementContent(element,page,data){
    if(!element)return {};
    if(element.type==='text')return {text:element.content!=null?element.content:(page[element.binding]||'')};
    if(element.type==='kpi')return Object.assign({},data.kpis[element.sourceIndex]||{},element.content||{});
    if(element.type==='chart')return {chartId:element.chartId||(element.binding?page[element.binding]:page.primaryChart),title:element.title||chartName(element.chartId||(element.binding?page[element.binding]:page.primaryChart),page.module)};
    if(element.type==='analysis')return {title:element.content&&element.content.title!=null?element.content.title:page.analysisTitle,lead:element.content&&element.content.lead!=null?element.content.lead:page.analysisLead,recommendation:element.content&&element.content.recommendation!=null?element.content.recommendation:page.recommendation};
    if(element.type==='image')return {name:element.assetName||element.name||'图片',src:element.src||'',fit:element.fit||'contain'};
    return element.content||{};
  }

  function elementStyle(element){

    return 'left:'+element.x+'%;top:'+element.y+'%;width:'+element.w+'%;height:'+element.h+'%;z-index:'+n(style.z)+';--element-font-size:'+n(style.fontSize)+'px;--element-color:'+esc(style.color)+';--element-bg:'+esc(style.background)+';--element-align:'+esc(style.textAlign)+';font-family:'+esc(style.fontFamily)+',sans-serif;font-size:'+n(style.fontSize)+'px;color:'+esc(style.color)+';text-align:'+esc(style.textAlign)+';background:'+esc(style.background)+';';

  function handles(){return '<i class="resize-handle nw" data-resize="nw"></i><i class="resize-handle ne" data-resize="ne"></i><i class="resize-handle sw" data-resize="sw"></i><i class="resize-handle se" data-resize="se"></i>';}

  function serializeState(){var snapshot=JSON.parse(JSON.stringify(state));delete snapshot.aiMessages;return JSON.stringify(snapshot);}
  function resetHistory(){history=[serializeState()];historyIndex=0;updateHistoryButtons();}
  function commitHistory(){
    clearTimeout(historyTimer);
    var snapshot=serializeState();
    if(history[historyIndex]===snapshot)return;
    history=history.slice(0,historyIndex+1);history.push(snapshot);
    if(history.length>60)history.shift();else historyIndex++;
    updateHistoryButtons();save();
  }
  function scheduleHistory(){clearTimeout(historyTimer);historyTimer=setTimeout(commitHistory,320);}
  function restoreHistory(index){if(index<0||index>=history.length)return;var messages=state.aiMessages||[];historyIndex=index;state=JSON.parse(history[index]);state.aiMessages=messages;selectedElementId=null;save(false);renderAll();updateHistoryButtons();}
  function undo(){restoreHistory(historyIndex-1);}
  function redo(){restoreHistory(historyIndex+1);}
  function updateHistoryButtons(){var undoButton=document.getElementById('undoButton'),redoButton=document.getElementById('redoButton');if(undoButton)undoButton.disabled=historyIndex<=0;if(redoButton)redoButton.disabled=historyIndex>=history.length-1;}

  function save(showState){
    try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));if(showState!==false){document.getElementById('saveState').textContent='已保存 '+new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});}}catch(err){document.getElementById('saveState').textContent='保存失败';}
  }
  function load(){
    try{var saved=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null');if(saved&&Array.isArray(saved.pages)&&saved.pages.length){state=saved;state.pages.forEach(ensurePageModel);return;}}catch(err){}
    var first=ensurePageModel(defaultsFor('display'));state={pages:[first],activeId:first.id,aiMessages:[]};save(false);
  }
  function activePage(){return state.pages.find(function(page){return page.id===state.activeId;})||state.pages[0]||null;}

  function chartName(id,module){var item=(chartOptions[module]||[]).find(function(x){return x.id===id;});return item?item.name:'数据图表';}
  function selectOptions(select,module,value){select.innerHTML=(chartOptions[module]||[]).map(function(item){return '<option value="'+esc(item.id)+'" '+(item.id===value?'selected':'')+'>'+esc(item.name)+'</option>';}).join('');}
  function renderPageList(){
    var list=document.getElementById('pageList');
    list.innerHTML=state.pages.map(function(page,index){return '<article class="page-item '+(page.id===state.activeId?'active':'')+'" data-page-id="'+esc(page.id)+'"><div class="page-index">'+String(index+1).padStart(2,'0')+'</div><div class="page-name">'+esc(page.title)+'</div><div class="page-module">'+esc(moduleMeta[page.module].name)+'</div><div class="page-actions"><button class="icon-btn page-up" type="button" title="上移" aria-label="上移">↑</button><button class="icon-btn page-down" type="button" title="下移" aria-label="下移">↓</button></div></article>';}).join('');
    document.getElementById('pageCount').textContent=state.pages.length+' PAGES';
  }

  function prepareChartRows(chartId,data,config){
    var rows=(/monthly$/.test(chartId)?data.monthly:(chartId==='approval-issues'?data.issues:data.zones)).slice();
    if(config.sort==='value-desc')rows.sort(function(a,b){return b.value-a.value;});
    if(config.sort==='value-asc')rows.sort(function(a,b){return a.value-b.value;});
    if(config.sort==='rate-desc')rows.sort(function(a,b){return n(b.rate)-n(a.rate);});
    if(config.sort==='rate-asc')rows.sort(function(a,b){return n(a.rate)-n(b.rate);});
    var topN=Math.max(1,Math.min(30,parseInt(config.topN,10)||10));
    return rows.slice(0,topN);
  }

  function axisTitles(parts,config,W,H,left,right,compact){
    if(compact)return;
    if(config.yAxisTitle)parts.push('<text x="'+left+'" y="10" fill="'+COLORS.muted+'" font-size="8" font-weight="700">'+esc(config.yAxisTitle)+'</text>');
    if(config.xAxisTitle)parts.push('<text x="'+((left+W-right)/2)+'" y="'+(H-1)+'" text-anchor="middle" fill="'+COLORS.muted+'" font-size="8" font-weight="700">'+esc(config.xAxisTitle)+'</text>');
  }

  function comboSvg(rows,compact,config){
    rows=rows||[];var W=900,H=compact?120:230,left=48,right=48,top=compact?15:23,bottom=compact?26:35,cw=W-left-right,ch=H-top-bottom;
    var primary=config.primaryColor||COLORS.coffee,secondary=config.secondaryColor||COLORS.red;
    var max=Math.max.apply(null,rows.map(function(x){return x.value;}).concat([1]));max=Math.ceil(max/100)*100||100;
    var step=cw/Math.max(rows.length,1),barW=Math.min(compact?28:38,step*.48),parts=[],points=[];
    for(var i=0;i<=4;i++){var y=top+ch-ch*i/4;parts.push('<line x1="'+left+'" y1="'+y+'" x2="'+(W-right)+'" y2="'+y+'" stroke="'+COLORS.grid+'" stroke-dasharray="3 4"/>');if(!compact){parts.push('<text x="'+(left-8)+'" y="'+(y+3)+'" text-anchor="end" fill="'+COLORS.muted+'" font-size="9">'+Math.round(max*i/4)+'</text><text x="'+(W-right+8)+'" y="'+(y+3)+'" fill="'+secondary+'" font-size="9">'+Math.round(100*i/4)+'%</text>');}}
    rows.forEach(function(row,index){var x=left+step*index+step/2,bh=row.value/max*ch,by=top+ch-bh,py=top+ch-n(row.rate)/100*ch;points.push(x+','+py);parts.push('<rect x="'+(x-barW/2)+'" y="'+by+'" width="'+barW+'" height="'+bh+'" rx="3" fill="'+primary+'"/>');if(config.showLabels&&!compact)parts.push('<text x="'+x+'" y="'+(by-5)+'" text-anchor="middle" fill="'+primary+'" font-size="8" font-weight="700">'+fmt(row.value)+'</text>');parts.push('<text x="'+x+'" y="'+(H-9)+'" text-anchor="middle" fill="'+COLORS.coffee+'" font-size="'+(compact?7:8)+'">'+esc(row.label)+'</text>');});
    if(points.length)parts.push('<polyline points="'+points.join(' ')+'" fill="none" stroke="'+secondary+'" stroke-width="2.5" stroke-linejoin="round"/>');
    rows.forEach(function(row,index){var x=left+step*index+step/2,py=top+ch-n(row.rate)/100*ch;parts.push('<circle cx="'+x+'" cy="'+py+'" r="3.5" fill="'+secondary+'" stroke="#fff" stroke-width="1.5"/>');if(config.showLabels&&!compact)parts.push('<text x="'+x+'" y="'+Math.max(9,py-7)+'" text-anchor="middle" fill="'+secondary+'" font-size="7.5" font-weight="700">'+pct(row.rate)+'</text>');});
    axisTitles(parts,config,W,H,left,right,compact);
    return '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none">'+parts.join('')+'</svg>';
  }

  function verticalSvg(rows,compact,config,asLine){
    rows=rows||[];var W=900,H=compact?120:230,left=48,right=28,top=compact?14:24,bottom=compact?25:34,cw=W-left-right,ch=H-top-bottom,metric=config.metric==='rate'?'rate':'value';
    var color=config.primaryColor||COLORS.coffee,values=rows.map(function(row){return n(row[metric]);}),max=metric==='rate'?100:Math.max.apply(null,values.concat([1]));if(metric!=='rate')max=Math.ceil(max/100)*100||100;
    var step=cw/Math.max(rows.length,1),barW=Math.min(compact?28:40,step*.52),parts=[],points=[];
    for(var i=0;i<=4;i++){var gy=top+ch-ch*i/4;parts.push('<line x1="'+left+'" y1="'+gy+'" x2="'+(W-right)+'" y2="'+gy+'" stroke="'+COLORS.grid+'" stroke-dasharray="3 4"/>');if(!compact)parts.push('<text x="'+(left-8)+'" y="'+(gy+3)+'" text-anchor="end" fill="'+COLORS.muted+'" font-size="8">'+(metric==='rate'?Math.round(max*i/4)+'%':Math.round(max*i/4))+'</text>');}
    rows.forEach(function(row,index){var value=n(row[metric]),x=left+step*index+step/2,y=top+ch-value/max*ch;points.push(x+','+y);if(!asLine)parts.push('<rect x="'+(x-barW/2)+'" y="'+y+'" width="'+barW+'" height="'+(top+ch-y)+'" rx="3" fill="'+color+'"/>');if(config.showLabels&&!compact)parts.push('<text x="'+x+'" y="'+Math.max(10,y-6)+'" text-anchor="middle" fill="'+color+'" font-size="8" font-weight="700">'+(metric==='rate'?pct(value):fmt(value))+'</text>');parts.push('<text x="'+x+'" y="'+(H-8)+'" text-anchor="middle" fill="'+COLORS.coffee+'" font-size="'+(compact?7:8)+'">'+esc(row.label)+'</text>');});
    if(asLine&&points.length){parts.push('<polyline points="'+points.join(' ')+'" fill="none" stroke="'+color+'" stroke-width="3" stroke-linejoin="round"/>');points.forEach(function(point){var xy=point.split(',');parts.push('<circle cx="'+xy[0]+'" cy="'+xy[1]+'" r="4" fill="'+color+'" stroke="#fff" stroke-width="1.5"/>');});}
    axisTitles(parts,config,W,H,left,right,compact);
    return '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none">'+parts.join('')+'</svg>';
  }

  function rankSvg(rows,compact,showRate,config){
    rows=rows||[];var W=900,H=compact?120:230,left=compact?90:130,right=70,top=8,bottom=8,cw=W-left-right,rowH=(H-top-bottom)/Math.max(rows.length,1),max=Math.max.apply(null,rows.map(function(x){return x.value;}).concat([1])),parts=[],primary=config.primaryColor||COLORS.coffee,secondary=config.secondaryColor||COLORS.red;
    rows.forEach(function(row,index){var y=top+rowH*index+rowH*.5,w=cw*row.value/max;parts.push('<text x="'+(left-8)+'" y="'+(y+3)+'" text-anchor="end" fill="'+COLORS.coffee+'" font-size="'+(compact?7:9)+'" font-weight="700">'+esc(row.label)+'</text>');parts.push('<rect x="'+left+'" y="'+(y-rowH*.22)+'" width="'+cw+'" height="'+(rowH*.44)+'" rx="3" fill="#eee7e0"/><rect x="'+left+'" y="'+(y-rowH*.22)+'" width="'+Math.max(3,w)+'" height="'+(rowH*.44)+'" rx="3" fill="'+(index===0?secondary:primary)+'"/>');if(config.showLabels)parts.push('<text x="'+(left+w+7)+'" y="'+(y+3)+'" fill="'+COLORS.muted+'" font-size="'+(compact?7:8)+'">'+fmt(row.value)+(showRate&&isFinite(row.rate)?' · '+pct(row.rate):'')+'</text>');});
    axisTitles(parts,config,W,H,left,right,compact);
    return '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none">'+parts.join('')+'</svg>';
  }

  function chartMarkup(chartId,data,compact,element){
    var config=element.chartConfig||{},rows=prepareChartRows(chartId,data,config),visual=config.visual||'auto';
    if(visual==='auto')visual=/monthly$/.test(chartId)?'combo':'rank';
    if(visual==='combo')return comboSvg(rows,compact,config);
    if(visual==='bar')return verticalSvg(rows,compact,config,false);
    if(visual==='line')return verticalSvg(rows,compact,config,true);
    return rankSvg(rows,compact,chartId!=='approval-issues'&&chartId!=='approval-province',config);
  }

  function startPointerEdit(event,elementNode){
    var element=selectedElement();if(!element)return;
    var body=document.querySelector('.rpt-body'),rect=body.getBoundingClientRect(),handle=event.target.closest('[data-resize]'),mode=handle?'resize':'move',direction=handle?handle.dataset.resize:'';
    var start={x:event.clientX,y:event.clientY,left:element.x,top:element.y,w:element.w,h:element.h};
    elementNode.classList.add('dragging');event.preventDefault();
    function move(pointerEvent){
      var dx=(pointerEvent.clientX-start.x)/rect.width*100,dy=(pointerEvent.clientY-start.y)/rect.height*100;
      if(mode==='move'){
        element.x=clamp(start.left+dx,0,100-element.w);element.y=clamp(start.top+dy,0,100-element.h);
      }else{
        var nextX=start.left,nextY=start.top,nextW=start.w,nextH=start.h;
        if(direction.indexOf('e')>=0)nextW=clamp(start.w+dx,4,100-start.left);
        if(direction.indexOf('s')>=0)nextH=clamp(start.h+dy,4,100-start.top);
        if(direction.indexOf('w')>=0){nextX=clamp(start.left+dx,0,start.left+start.w-4);nextW=start.w+(start.left-nextX);}
        if(direction.indexOf('n')>=0){nextY=clamp(start.top+dy,0,start.top+start.h-4);nextH=start.h+(start.top-nextY);}
        element.x=nextX;element.y=nextY;element.w=nextW;element.h=nextH;
      }
      elementNode.style.left=element.x+'%';elementNode.style.top=element.y+'%';elementNode.style.width=element.w+'%';elementNode.style.height=element.h+'%';updatePositionInputs(element);
    }
    function end(){window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',end);elementNode.classList.remove('dragging');commitHistory();}
    window.addEventListener('pointermove',move);window.addEventListener('pointerup',end,{once:true});
  }

  function aiChartTarget(text){return /辅助图|副图|下方图/.test(text)?'secondary-chart':'primary-chart';}

  function aiColor(text){
    var hex=String(text).match(/#[0-9a-fA-F]{6}/);if(hex)return hex[0];
    var colors={'咖啡色':'#713618','棕色':'#713618','黄色':'#f7c900','金色':'#f7c900','红色':'#d93924','珊瑚色':'#ec5f74','粉色':'#ec5f74','蓝色':'#3478b8','蓝绿色':'#168a8a','绿色':'#43875b','黑色':'#352016','白色':'#ffffff','灰色':'#806d62'};
    return Object.keys(colors).find(function(name){return text.indexOf(name)>=0;})?colors[Object.keys(colors).find(function(name){return text.indexOf(name)>=0;})]:null;
  }
  function aiChartView(module,text){

    if(module==='approval'){if(/问题|不合格类型/.test(text))return 'approval-issues';if(/省区|省份/.test(text))return 'approval-province';if(/月度|每月|月份/.test(text))return 'approval-monthly';}

  }

  function parseLocalAICommand(input){
    var text=String(input||'').trim(),page=activePage(),operations=[],segments=text.split(/[\n；;]/).map(function(item){return item.trim();}).filter(Boolean);
    if(!text)return {operations:[],response:'请输入需要修改的内容。',error:true};
    if(/^(撤销|回退|上一步)$/.test(text))return {operations:[{action:'undo'}],response:'已撤销上一步修改。'};
    if(/^(重做|恢复下一步)$/.test(text))return {operations:[{action:'redo'}],response:'已恢复下一步修改。'};
    if(/恢复默认布局|重置布局|自动排版/.test(text))operations.push({action:'reset-layout'});
    if(/复制(?:当前)?页|复制本页/.test(text))operations.push({action:'duplicate-page'});
    if(/删除(?:当前|选中)?(?:的)?(?:组件|元素)/.test(text))operations.push({action:'delete-selected-element'});
    if(/新增|添加|创建/.test(text)){var module=aiModule(text);if(module)operations.push({action:'add-page',module:module});}

    segments.forEach(function(segment){
      var value=aiFieldValue(segment,'分析标题');
      if(value){operations.push({action:'set-page-field',field:'analysisTitle',value:value});return;}
      value=aiFieldValue(segment,'核心分析');
      if(value){operations.push({action:'set-page-field',field:'analysisLead',value:value});return;}
      value=aiFieldValue(segment,'管理建议');
      if(value){operations.push({action:'set-page-field',field:'recommendation',value:value});return;}
      value=aiFieldValue(segment,'摘要');
      if(value){operations.push({action:'set-page-field',field:'summary',value:value});return;}
      value=aiFieldValue(segment,'标题');
      if(value){operations.push({action:'set-page-field',field:'title',value:value});return;}
    });

    if(page&&/(主图|辅助图|副图|图表|战区|省区|每月|月度|问题类型)/.test(text)){
      var target=aiChartTarget(text),view=aiChartView(page.module,text),visual=null,topMatch=text.match(/(?:前|TOP\s*|top\s*)(\d+)\s*(?:项|个|名)?/i);
      if(view)operations.push({action:'set-chart-view',target:target,chartId:view});
      if(/柱线|组合/.test(text))visual='combo';else if(/柱状|柱形/.test(text))visual='bar';else if(/折线|趋势线/.test(text))visual='line';else if(/排行|横向条/.test(text))visual='rank';else if(/自动匹配|自动图表/.test(text))visual='auto';
      if(visual)operations.push({action:'set-chart-config',target:target,property:'visual',value:visual});
      if(topMatch)operations.push({action:'set-chart-config',target:target,property:'topN',value:parseInt(topMatch[1],10)});
      if(/隐藏|不要|去掉/.test(text)&&/图例/.test(text))operations.push({action:'set-chart-config',target:target,property:'showLegend',value:false});
      if(/显示|打开|保留/.test(text)&&/图例/.test(text)&&!/隐藏|不要|去掉/.test(text))operations.push({action:'set-chart-config',target:target,property:'showLegend',value:true});
      if(/隐藏|不要|去掉/.test(text)&&/标签|数值/.test(text))operations.push({action:'set-chart-config',target:target,property:'showLabels',value:false});
      if(/显示|打开|保留/.test(text)&&/标签|数值/.test(text)&&!/隐藏|不要|去掉/.test(text))operations.push({action:'set-chart-config',target:target,property:'showLabels',value:true});
      if(/数量降序|按数量从高到低/.test(text))operations.push({action:'set-chart-config',target:target,property:'sort',value:'value-desc'});
      if(/数量升序|按数量从低到高/.test(text))operations.push({action:'set-chart-config',target:target,property:'sort',value:'value-asc'});
      if(/(?:比率|合格率)降序|按(?:比率|合格率)从高到低/.test(text))operations.push({action:'set-chart-config',target:target,property:'sort',value:'rate-desc'});
      if(/(?:比率|合格率)升序|按(?:比率|合格率)从低到高/.test(text))operations.push({action:'set-chart-config',target:target,property:'sort',value:'rate-asc'});
      if(/只看|指标/.test(text)){if(/合格率|比率/.test(text))operations.push({action:'set-chart-config',target:target,property:'metric',value:'rate'});else if(/数量|条数|门店数/.test(text))operations.push({action:'set-chart-config',target:target,property:'metric',value:'value'});}
      var color=aiColor(text);
      if(color){operations.push({action:'set-chart-config',target:target,property:/折线|比率线|合格率线/.test(text)?'secondaryColor':'primaryColor',value:color});}
    }

    var fontMatch=text.match(/(?:字号|字体大小)(?:改成|修改为|设置为|调整为)?\s*(\d+)/);
    if(fontMatch){
      operations.push({action:'set-element-style',target:/所有(?:的)?指标卡|全部(?:的)?指标卡/.test(text)?'all-kpis':'selected',property:'fontSize',value:parseInt(fontMatch[1],10)});
    }
    if(!operations.length)return {operations:[],response:'这条指令暂未识别。可以尝试“主图改成柱状图”“页面标题改成……”“所有指标卡字号改成 28”。',error:true};
    return {operations:operations,response:'已按指令完成 '+operations.length+' 项修改。'};
  }

  function aiChartElement(page,target){return page.elements.find(function(item){return item.id===target;})||page.elements.find(function(item){return item.binding===(target==='secondary-chart'?'secondaryChart':'primaryChart');});}
  function applyAIOperations(operations){
    operations=Array.isArray(operations)?operations.slice(0,20):[];
    if(operations.some(function(op){return op&&op.action==='undo';})){undo();return {applied:1};}
    if(operations.some(function(op){return op&&op.action==='redo';})){redo();return {applied:1};}
    var applied=0;
    operations.forEach(function(op){
      if(!op||typeof op.action!=='string')return;
      var page=activePage(),element,defaults,allowed;
      if(op.action==='set-page-field'&&page){
        allowed=['title','summary','analysisTitle','analysisLead','recommendation'];
        if(allowed.indexOf(op.field)<0||typeof op.value!=='string')return;
        page[op.field]=op.value.slice(0,800);
        if(/^analysis/.test(op.field)){element=page.elements.find(function(item){return item.type==='analysis';});if(element&&element.content){var key=op.field==='analysisTitle'?'title':(op.field==='analysisLead'?'lead':'recommendation');element.content[key]=page[op.field];}}
        applied++;
      }else if(op.action==='set-chart-view'&&page){
        var validView=(chartOptions[page.module]||[]).some(function(item){return item.id===op.chartId;});if(!validView)return;
        element=aiChartElement(page,op.target);if(!element)return;element.chartId=op.chartId;element.title=chartName(op.chartId,page.module);if(element.binding)page[element.binding]=op.chartId;applied++;
      }else if(op.action==='set-chart-config'&&page){
        element=aiChartElement(page,op.target);if(!element)return;ensurePageModel(page);
        allowed=['visual','metric','sort','topN','showLabels','showLegend','primaryColor','secondaryColor','xAxisTitle','yAxisTitle'];if(allowed.indexOf(op.property)<0)return;
        var chartValue=op.value;
        if(op.property==='topN')chartValue=clamp(parseInt(chartValue,10)||1,1,30);
        if(op.property==='showLabels'||op.property==='showLegend')chartValue=Boolean(chartValue);
        if(op.property==='primaryColor'||op.property==='secondaryColor'){if(!/^#[0-9a-f]{6}$/i.test(String(chartValue)))return;}
        element.chartConfig[op.property]=chartValue;applied++;
      }else if(op.action==='set-element-style'&&page){
        var targets=op.target==='all-kpis'?page.elements.filter(function(item){return item.type==='kpi'&&!item.hidden;}):[selectedElement()].filter(Boolean);
        allowed=['fontSize','color','background','textAlign','fontFamily'];if(allowed.indexOf(op.property)<0)return;
        targets.forEach(function(item){var styleValue=op.value;if(op.property==='fontSize')styleValue=clamp(n(styleValue),6,72);if((op.property==='color'||op.property==='background')&&!/^#[0-9a-f]{6}$/i.test(String(styleValue)))return;item.style[op.property]=styleValue;applied++;});
      }else if(op.action==='add-page'&&moduleMeta[op.module]){
        var newPage=ensurePageModel(defaultsFor(op.module));state.pages.push(newPage);state.activeId=newPage.id;selectedElementId=null;applied++;
      }else if(op.action==='duplicate-page'&&page){
        var copy=JSON.parse(JSON.stringify(page));copy.id=uid();copy.title=page.title+'（副本）';var pageIndex=state.pages.indexOf(page);state.pages.splice(pageIndex+1,0,copy);state.activeId=copy.id;selectedElementId=null;applied++;
      }else if(op.action==='delete-selected-element'){
        element=selectedElement();if(!element)return;element.hidden=true;selectedElementId=null;applied++;
      }else if(op.action==='reset-layout'&&page){
        defaults=defaultElements(page);defaults.forEach(function(base){var current=page.elements.find(function(item){return item.id===base.id;});if(current){current.x=base.x;current.y=base.y;current.w=base.w;current.h=base.h;current.hidden=false;}});applied++;
      }
    });
    if(applied){renderAll();commitHistory();}
    return {applied:applied};
  }

  async function requestAIOperations(text){
    document.getElementById('aiMode').textContent='本地安全指令模式';
    return parseLocalAICommand(text);
  }

  function ensureAIChat(){
    if(!Array.isArray(state.aiMessages))state.aiMessages=[];
    if(!state.aiMessages.length)state.aiMessages.push({role:'assistant',text:'可以直接告诉我如何修改当前汇报页。现在使用本地安全指令模式，支持修改文字、图表、指标卡样式、页面与布局。'});
  }
  function renderAIChat(){
    ensureAIChat();var host=document.getElementById('aiMessages');host.innerHTML='';
    state.aiMessages.forEach(function(message){var node=document.createElement('div');node.className='ai-message '+(message.role==='user'?'user':'assistant')+(message.error?' error':'');node.textContent=message.text;host.appendChild(node);});
    host.scrollTop=host.scrollHeight;
  }
  function addAIMessage(role,text,error){ensureAIChat();state.aiMessages.push({role:role,text:String(text||''),error:Boolean(error)});state.aiMessages=state.aiMessages.slice(-40);save(false);renderAIChat();}
  function setAIThinking(show){
    var button=document.getElementById('aiSendButton'),host=document.getElementById('aiMessages'),thinking=document.getElementById('aiThinking');button.disabled=show;
    if(show&&!thinking){thinking=document.createElement('div');thinking.id='aiThinking';thinking.className='ai-message assistant';thinking.innerHTML='<span class="ai-thinking" aria-label="正在处理"></span>';host.appendChild(thinking);host.scrollTop=host.scrollHeight;}
    if(!show&&thinking)thinking.remove();
  }
  async function handleAICommand(text){
    text=String(text||'').trim();if(!text)return;
    addAIMessage('user',text,false);setAIThinking(true);
    try{
      var result=await requestAIOperations(text),applied=applyAIOperations(result.operations);
      var response=result.response||(applied.applied?'已完成 '+applied.applied+' 项修改。':'没有执行任何修改。');
      addAIMessage('assistant',response,Boolean(result.error||!applied.applied));
    }catch(err){addAIMessage('assistant','操作未执行：'+(err&&err.message?err.message:'AI 返回内容无效'),true);}
    finally{setAIThinking(false);}
  }

  document.getElementById('pageList').addEventListener('click',function(event){var item=event.target.closest('.page-item');if(!item)return;var id=item.dataset.pageId;if(event.target.closest('.page-up')){event.stopPropagation();movePage(id,-1);return;}if(event.target.closest('.page-down')){event.stopPropagation();movePage(id,1);return;}setActive(id);});
  document.getElementById('contentForm').addEventListener('input',function(event){
    var page=activePage();if(!page||!event.target.name)return;page[event.target.name]=event.target.value;
    if(/^analysis/.test(event.target.name)){var analysis=page.elements.find(function(element){return element.type==='analysis';});if(analysis&&analysis.content){var key=event.target.name==='analysisTitle'?'title':(event.target.name==='analysisLead'?'lead':'recommendation');analysis.content[key]=event.target.value;}}
    document.getElementById('saveState').textContent='正在保存…';renderCanvas();clearTimeout(window.__reportSaveTimer);window.__reportSaveTimer=setTimeout(function(){save();renderPageList();scheduleHistory();},350);
  });
  document.getElementById('primaryChartSelect').addEventListener('change',function(){var page=activePage();if(!page)return;page.primaryChart=this.value;var chart=page.elements.find(function(element){return element.binding==='primaryChart';});if(chart){chart.chartId=this.value;chart.title='';}renderCanvas();renderElementInspector();commitHistory();});
  document.getElementById('secondaryChartSelect').addEventListener('change',function(){var page=activePage();if(!page)return;page.secondaryChart=this.value;var chart=page.elements.find(function(element){return element.binding==='secondaryChart';});if(chart){chart.chartId=this.value;chart.title='';}renderCanvas();renderElementInspector();commitHistory();});
  document.getElementById('reportCanvas').addEventListener('pointerdown',function(event){
    var node=event.target.closest('.editable-element');
    if(!node){selectElement(null);return;}
    selectElement(node.dataset.elementId);
    if(event.button===0&&!event.target.closest('[contenteditable="true"]'))startPointerEdit(event,node);
  });
  document.getElementById('reportCanvas').addEventListener('dblclick',function(event){
    var node=event.target.closest('.editable-element'),target=event.target.closest('.rpt-title,.rpt-summary,.rpt-panel-title');
    if(!node||!target)return;selectElement(node.dataset.elementId);startInlineTextEdit(target,selectedElement());event.stopPropagation();
  });
  document.getElementById('elementInspector').addEventListener('input',function(event){
    var element=selectedElement();if(!element)return;
    var prop=event.target.dataset.elementProp,contentProp=event.target.dataset.contentProp,chartProp=event.target.dataset.chartProp,value=event.target.value;
    if(prop){var numeric=n(value);if(prop==='x')element.x=clamp(numeric,0,100-element.w);if(prop==='y')element.y=clamp(numeric,0,100-element.h);if(prop==='w')element.w=clamp(numeric,4,100-element.x);if(prop==='h')element.h=clamp(numeric,4,100-element.y);}
    if(contentProp)syncElementContent(element,contentProp,value);
    if(chartProp&&element.type==='chart'){
      if(chartProp==='showLabels'||chartProp==='showLegend')element.chartConfig[chartProp]=event.target.checked;
      else if(chartProp==='topN')element.chartConfig[chartProp]=clamp(parseInt(value,10)||1,1,30);
      else element.chartConfig[chartProp]=value;
    }
    if(event.target.id==='elementFontFamily')element.style.fontFamily=value;
    if(event.target.id==='elementFontSize')element.style.fontSize=clamp(n(value),6,72);
    if(event.target.id==='elementTextAlign')element.style.textAlign=value;
    if(event.target.id==='elementColor')element.style.color=value;
    if(event.target.id==='elementBackground')element.style.background=value;
    document.getElementById('saveState').textContent='正在保存…';renderCanvas();scheduleHistory();
  });
  document.getElementById('addPageButton').addEventListener('click',openModal);
  document.getElementById('closeModalButton').addEventListener('click',closeModal);
  document.getElementById('addPageModal').addEventListener('click',function(event){if(event.target===this)closeModal();});
  document.querySelectorAll('.module-option').forEach(function(button){button.addEventListener('click',function(){addPage(this.dataset.module);});});
  document.getElementById('layoutLibraryButton').addEventListener('click',openLayoutModal);
  document.getElementById('imageLibraryButton').addEventListener('click',function(){openImageModal(null);});
  document.getElementById('closeLayoutModalButton').addEventListener('click',closeLayoutModal);
  document.getElementById('closeImageModalButton').addEventListener('click',closeImageModal);
  document.getElementById('layoutModal').addEventListener('click',function(event){if(event.target===this){closeLayoutModal();return;}var button=event.target.closest('[data-layout-id]');if(button)applyLayout(button.dataset.layoutId,button.dataset.layoutSource);});
  document.getElementById('imageModal').addEventListener('click',function(event){if(event.target===this){closeImageModal();return;}var button=event.target.closest('[data-image-name]');if(!button)return;var asset=imageCatalog.find(function(item){return item.name===button.dataset.imageName;});addOrReplaceImage(asset);});
  document.getElementById('elementInspector').addEventListener('click',function(event){if(event.target.id==='replaceImageButton'){event.preventDefault();var element=selectedElement();if(element&&element.type==='image')openImageModal(element.id);}});
  document.getElementById('deletePageButton').addEventListener('click',deleteActive);
  document.getElementById('duplicatePageButton').addEventListener('click',duplicateActive);
  document.getElementById('duplicateElementButton').addEventListener('click',duplicateSelectedElement);
  document.getElementById('deleteElementButton').addEventListener('click',deleteSelectedElement);
  document.getElementById('copyElementButton').addEventListener('click',copySelectedElement);
  document.getElementById('pasteElementButton').addEventListener('click',pasteElement);
  document.getElementById('undoButton').addEventListener('click',undo);
  document.getElementById('redoButton').addEventListener('click',redo);
  document.getElementById('saveButton').addEventListener('click',function(){save();});
  document.getElementById('aiAssistantButton').addEventListener('click',function(){var panel=document.getElementById('aiPanel');panel.classList.toggle('show');if(panel.classList.contains('show')){renderAIChat();document.getElementById('aiInput').focus();}});
  document.getElementById('aiCloseButton').addEventListener('click',function(){document.getElementById('aiPanel').classList.remove('show');});
  document.getElementById('aiForm').addEventListener('submit',function(event){event.preventDefault();var input=document.getElementById('aiInput'),text=input.value;input.value='';handleAICommand(text);});
  document.getElementById('aiInput').addEventListener('keydown',function(event){if((event.ctrlKey||event.metaKey)&&event.key==='Enter'){event.preventDefault();document.getElementById('aiForm').requestSubmit();}});
  document.querySelectorAll('.ai-suggestion').forEach(function(button){button.addEventListener('click',function(){document.getElementById('aiInput').value=this.textContent;document.getElementById('aiForm').requestSubmit();});});
  document.addEventListener('keydown',function(event){
    var tag=(event.target.tagName||'').toLowerCase(),typing=tag==='input'||tag==='textarea'||tag==='select'||event.target.isContentEditable;
    if(event.key==='Escape'){document.getElementById('aiPanel').classList.remove('show');closeLayoutModal();closeImageModal();closeModal();}
    if(typing)return;
    if((event.ctrlKey||event.metaKey)&&event.key.toLowerCase()==='c'){event.preventDefault();copySelectedElement();}
    if((event.ctrlKey||event.metaKey)&&event.key.toLowerCase()==='v'){event.preventDefault();pasteElement();}
    if((event.ctrlKey||event.metaKey)&&event.key.toLowerCase()==='z'){event.preventDefault();event.shiftKey?redo():undo();}
    if((event.ctrlKey||event.metaKey)&&event.key.toLowerCase()==='y'){event.preventDefault();redo();}
    if((event.key==='Delete'||event.key==='Backspace')&&selectedElementId){event.preventDefault();deleteSelectedElement();}
  });

  load();ensureAIChat();renderAll();renderAIChat();resetHistory();save(false);loadLocalLibraries();
})();
</script>
</body>
</html>
