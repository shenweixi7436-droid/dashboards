<script>
(function(){
  'use strict';
  var FONT_NUMBER='"GOTHAMRND-BOLD","HKYuan-W7",sans-serif';
  var FONT_TEXT='"GOTHAMRND-BOLD","HKYuan-W7",sans-serif';
  var FONT_HEADING='"GOTHAMRND-BOLD","HKYuan-W8",sans-serif';
  var analytics={
    year:2026,
    afterSales:[0,0,0,0,0,12,0,0,0,0,0,0]
  };
  var main=document.getElementById('dashboard-main');
  var inventoryQuantityLink=document.getElementById('inventory-quantity-card-link');
  var materialOutboundAmount=document.getElementById('material-outbound-amount');
  var materialOutboundProvinceCount=document.getElementById('material-outbound-province-count');
  var materialOutboundCityCount=document.getElementById('material-outbound-city-count');
  var materialOutboundGrowth=document.getElementById('material-outbound-growth');
  var materialOutboundGrowthMeta=document.getElementById('material-outbound-growth-meta');
  var afterValue=document.getElementById('after-sales-value');
  var afterMeta=document.getElementById('after-sales-meta');
  var developmentValue=document.getElementById('development-value');
  var developmentMeta=document.getElementById('development-meta');
  var deviceWeeklyValue=document.getElementById('device-weekly-value');
  var deviceWeeklyData=window.DEVICE_WEEKLY_OUTBOUND_DATA||{};
  window.deviceWeeklyData=deviceWeeklyData;
  var materialWeeklyValue=document.getElementById('material-weekly-value');
  var materialWeeklyData=window.MATERIAL_WEEKLY_OUTBOUND_DATA||{};
  var freightMonths=window.FREIGHT_PAYLOAD&&Array.isArray(window.FREIGHT_PAYLOAD.months)?window.FREIGHT_PAYLOAD.months:[];
  var inventoryOutboundData=window.INVENTORY_OUTBOUND_DATA||{};
  var materialSummaryData=window.MATERIAL_SUMMARY_DATA||{};
  var materialCategoryRankData=window.MATERIAL_CATEGORY_RANK_DATA||{months:{}};
  var outboundCityData=window.OUTBOUND_CITY_DATA||{year:analytics.year,byMonth:{}};
  var materialFilterData=window.MATERIAL_FILTER_DATA||{rows:[]};
  var outboundProvinceFilter='';
  var outboundDetailMode='material';
  var activeMonth=5;
  var materialFilterState={query:'',timeMode:'month',province:'',city:'',start:'',end:''};
  var materialFilterApplied={query:'',timeMode:'month',province:'',city:'',start:'',end:''};
  var materialFilterCache={key:'',rows:[]};

  function formatMoney(value){return '¥'+Number(value||0).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});}
  function formatRatio(value){return Number.isFinite(value)?value.toFixed(2)+'%':'暂无数据';}
  function formatQuantity(value){var n=Number(value||0);return Number.isInteger(n)?n.toLocaleString('zh-CN'):n.toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});}
  function formatOutboundAmount(value){
    var n=Number(value);
    return Number.isFinite(n)?(n/10000).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2}):'暂无数据';
  }
  function formatSummaryMoney(value){var n=Number(value);return Number.isFinite(n)?(n/10000).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2})+'万元':'暂无数据';}
  function formatSummaryPercent(value){var n=Number(value);return Number.isFinite(n)?(n*100).toFixed(2)+'%':'暂无数据';}
  function formatOutboundQuantity(value){
    var n=Number(value);
    return Number.isFinite(n)?Math.round(n).toLocaleString('zh-CN'):'—';
  }
  function pad2(value){return String(value).padStart(2,'0');}
  function toIsoDate(date){return date.getFullYear()+'-'+pad2(date.getMonth()+1)+'-'+pad2(date.getDate());}
  function shiftIsoDate(value,days){var date=new Date(value+'T00:00:00');if(!Number.isFinite(date.getTime()))return value;date.setDate(date.getDate()+days);return toIsoDate(date);}
  function monthWindow(month){
    var m=Number(month);if(!Number.isFinite(m))m=10;
    var start=new Date(2026,m-1,1),end=new Date(2026,m,1);
    return {start:toIsoDate(start),end:toIsoDate(end)};
  }
  function getMaterialFilterWindow(){
    var month=Number(window.DASHBOARD_MONTH)||activeMonth,mode=materialFilterApplied.timeMode;
    if(mode==='prev')return monthWindow(month-1);
    if(mode==='custom'&&materialFilterApplied.start&&materialFilterApplied.end){
      var customEnd=shiftIsoDate(materialFilterApplied.end,1);return {start:materialFilterApplied.start,end:customEnd};
    }
    var base=monthWindow(month),lastDate='';
    if(mode==='7d'||mode==='30d'){
      (materialFilterData.rows||[]).forEach(function(row){if(Number(row.m)===month&&row.d>lastDate)lastDate=row.d;});
      if(!lastDate)lastDate=shiftIsoDate(base.end,-1);
      return {start:shiftIsoDate(lastDate,mode==='7d'?-6:-29),end:shiftIsoDate(lastDate,1)};
    }
    return base;
  }
  function getComparisonWindow(windowRange){
    var start=new Date(windowRange.start+'T00:00:00'),end=new Date(windowRange.end+'T00:00:00');
    var span=Math.max(1,Math.round((end-start)/86400000));
    return {start:shiftIsoDate(windowRange.start,-span),end:windowRange.start};
  }
  function materialFilterRowMatches(row,windowRange){
    if(row.d<windowRange.start||row.d>=windowRange.end)return false;
    if(materialFilterApplied.query&&String(row.n||'').toLowerCase().indexOf(materialFilterApplied.query.toLowerCase())<0)return false;
    if(materialFilterApplied.province&&row.p!==materialFilterApplied.province)return false;
    if(materialFilterApplied.city&&row.c!==materialFilterApplied.city)return false;
    return true;
  }
  function getFilteredMaterialRows(windowRange){
    var key=[windowRange.start,windowRange.end,materialFilterApplied.query,materialFilterApplied.province,materialFilterApplied.city].join('|');
    if(materialFilterCache.key===key)return materialFilterCache.rows;
    materialFilterCache={key:key,rows:(materialFilterData.rows||[]).filter(function(row){return materialFilterRowMatches(row,windowRange);})};
    return materialFilterCache.rows;
  }
  function aggregateMaterialRows(rows){
    var total=0,provinces={},cities={},byDate={},byCategory={};
    rows.forEach(function(row){
      var amount=Number(row.a)||0;total+=amount;
      provinces[row.p]=(provinces[row.p]||0)+amount;cities[row.c]=(cities[row.c]||0)+amount;
      byDate[row.d]=(byDate[row.d]||0)+amount;byCategory[row.g]=(byCategory[row.g]||0)+amount;
    });
    return {total:total,provinces:provinces,cities:cities,byDate:byDate,byCategory:byCategory};
  }
  function materialFilterLabel(){
    var range=getMaterialFilterWindow(),summary=range.start+' 至 '+shiftIsoDate(range.end,-1);
    if(materialFilterApplied.timeMode==='month')summary=(Number(window.DASHBOARD_MONTH)||activeMonth)+'月（'+summary+'）';
    if(materialFilterApplied.timeMode==='prev')summary='上月（'+summary+'）';
    return summary;
  }
  function renderMaterialFilterOptions(){
    var province=document.getElementById('material-filter-province'),city=document.getElementById('material-filter-city');
    if(!province||!city)return;
    var currentProvince=materialFilterState.province;
    var provinces={};(materialFilterData.rows||[]).forEach(function(row){provinces[row.p]=true;});
    province.innerHTML='<option value="">全部省份</option>'+Object.keys(provinces).sort(function(a,b){return a.localeCompare(b,'zh-CN');}).map(function(value){return '<option value="'+escapeOutboundText(value)+'">'+escapeOutboundText(value)+'</option>';}).join('');
    province.value=currentProvince;
    var currentCity=materialFilterState.city, cities={};
    (materialFilterData.rows||[]).forEach(function(row){if(!currentProvince||row.p===currentProvince)cities[row.c]=true;});
    city.innerHTML='<option value="">全部市区</option>'+Object.keys(cities).sort(function(a,b){return a.localeCompare(b,'zh-CN');}).map(function(value){return '<option value="'+escapeOutboundText(value)+'">'+escapeOutboundText(value)+'</option>';}).join('');
    city.value=currentCity&&cities[currentCity]?currentCity:'';
  }
  function renderMaterialFilterSummary(){
    var summary=document.getElementById('material-filter-summary');if(!summary)return;
    var chips=['物料：'+(materialFilterApplied.query||'全部物料')];
    if(materialFilterApplied.province)chips.push('省份：'+materialFilterApplied.province);
    if(materialFilterApplied.city)chips.push('市区：'+materialFilterApplied.city);
    summary.textContent=materialFilterLabel()+(chips.length?'　'+chips.join('　'):'');
  }
  function applyMaterialFilters(){
    materialFilterApplied={query:materialFilterState.query,timeMode:materialFilterState.timeMode,province:materialFilterState.province,city:materialFilterState.city,start:materialFilterState.start,end:materialFilterState.end};
    materialFilterCache={key:'',rows:[]};categoryRankRenderedMonth=null;dailyOutboundHoverIndex=-1;
    renderMaterialFilterSummary();renderOutboundCard();redraw();renderOutboundDetailModal();
  }
  function initializeMaterialFilters(){
    var search=document.getElementById('material-filter-search'),time=document.getElementById('material-filter-time'),province=document.getElementById('material-filter-province'),city=document.getElementById('material-filter-city'),start=document.getElementById('material-filter-start'),end=document.getElementById('material-filter-end'),range=document.getElementById('material-filter-range');
    renderMaterialFilterOptions();
    function syncRange(){range.classList.toggle('is-visible',time.value==='custom');}
    search.addEventListener('input',function(){materialFilterState.query=this.value.trim();});
    search.addEventListener('keydown',function(event){if(event.key==='Enter')applyMaterialFilters();});
    time.addEventListener('change',function(){materialFilterState.timeMode=this.value;syncRange();});
    province.addEventListener('change',function(){materialFilterState.province=this.value;materialFilterState.city='';renderMaterialFilterOptions();});
    city.addEventListener('change',function(){materialFilterState.city=this.value;});
    start.addEventListener('change',function(){materialFilterState.start=this.value;});
    end.addEventListener('change',function(){materialFilterState.end=this.value;});
    document.getElementById('material-filter-apply').addEventListener('click',applyMaterialFilters);
    document.getElementById('material-filter-reset').addEventListener('click',function(){
      materialFilterState={query:'',timeMode:'month',province:'',city:'',start:'',end:''};
      search.value='';time.value='month';start.value='';end.value='';syncRange();renderMaterialFilterOptions();applyMaterialFilters();
    });
    syncRange();renderMaterialFilterSummary();
  }
  function renderOutboundCard(){
    var range=getMaterialFilterWindow(),rows=getFilteredMaterialRows(range),summary=aggregateMaterialRows(rows);
    var previousSummary=aggregateMaterialRows(getFilteredMaterialRows(getComparisonWindow(range)));
    materialOutboundAmount.textContent=rows.length?formatSummaryMoney(summary.total):'暂无数据';
    materialOutboundProvinceCount.textContent=rows.length?Object.keys(summary.provinces).length.toLocaleString('zh-CN')+'个省份':'暂无数据';
    materialOutboundCityCount.textContent='共计'+(rows.length?Object.keys(summary.cities).length.toLocaleString('zh-CN'):'暂无数据')+'个地级市';
    var growth=rows.length&&previousSummary.total?summary.total/previousSummary.total-1:NaN;
    materialOutboundGrowth.className='kpi-value growth-value';
    if(Number.isFinite(growth)){
      materialOutboundGrowth.textContent=(growth>0?'+':'')+(growth*100).toFixed(2)+'%';
      materialOutboundGrowth.classList.add(growth>0?'is-up':(growth<0?'is-down':'is-flat'));
      materialOutboundGrowthMeta.textContent='较上一等长周期物料出库金额';
    }else{
      materialOutboundGrowth.classList.add('is-flat');
      materialOutboundGrowth.textContent='暂无数据';
      materialOutboundGrowthMeta.textContent='无上一周期数据，暂不计算增速';
    }
  }
  function renderMaterialSummary(){
    var month=String(Number(window.DASHBOARD_MONTH)||10);
    var item=materialSummaryData.months&&materialSummaryData.months[month]?materialSummaryData.months[month]:null;
    var inventory=materialSummaryData.inventory||{};
    var hasInventory=inventory.amount!==null&&inventory.amount!==undefined&&Number.isFinite(Number(inventory.amount));
    document.getElementById('inventory-summary-amount').textContent=hasInventory?formatSummaryMoney(inventory.amount):'暂无数据';
    document.getElementById('inventory-summary-top-detail').textContent=hasInventory?'其中第一物料：'+(inventory.topName||'暂无数据')+'；金额：'+formatSummaryMoney(inventory.topAmount):'当前源数据不包含库存金额';
  }
  function escapeOutboundText(value){
    return String(value==null?'':value).replace(/[&<>"']/g,function(char){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char];});
  }
  function formatOutboundCityAmount(value){
    var amount=Number(value);
    return Number.isFinite(amount)?(amount/10000).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2}):'—';
  }
  function outboundCityMomText(value){
    var ratio=Number(value);
    if(value===null||value===undefined||!Number.isFinite(ratio))return '—';
    if(ratio===0)return '0.0%';
    return (ratio>0?'+':'-')+Math.abs(ratio*100).toFixed(1)+'%';
  }
  function outboundCityMomClass(value){
    var ratio=Number(value);
    if(value===null||value===undefined||!Number.isFinite(ratio)||ratio===0)return 'is-flat';
    return ratio>0?'is-up':'is-down';
  }
  function getActiveOutboundCityDetail(){
    var month=Number(window.DASHBOARD_MONTH)||activeMonth;
    if(outboundDetailMode==='material'&&materialFilterData.rows&&materialFilterData.rows.length){
      var range=getMaterialFilterWindow(),rows=getFilteredMaterialRows(range),previousRows=getFilteredMaterialRows(getComparisonWindow(range));
      var current={},previous={},total=0;
      rows.forEach(function(row){var key=row.p+'\u0001'+row.c;if(!current[key])current[key]={province:row.p,city:row.c,amount:0};current[key].amount+=Number(row.a)||0;total+=Number(row.a)||0;});
      previousRows.forEach(function(row){var key=row.p+'\u0001'+row.c;previous[key]=(previous[key]||0)+(Number(row.a)||0);});
      var detailRows=Object.keys(current).map(function(key){var item=current[key],prev=previous[key]||0;return {province:item.province,city:item.city,amount:item.amount,previousAmount:prev,amountMom:prev?item.amount/prev-1:null,share:total?item.amount/total:0};});
      detailRows.sort(function(a,b){return b.amount-a.amount||a.city.localeCompare(b.city,'zh-CN');});
      return {month:month,detail:{previousMonth:null,total:total,rows:detailRows},year:materialFilterData.year||analytics.year};
    }
    var source=outboundDetailMode==='device'?(outboundCityData.deviceByMonth||{}):(outboundCityData.byMonth||{});
    return {month:month,detail:source[String(month)]||null,year:Number(outboundCityData.deviceYear||outboundCityData.year)||analytics.year};
  }
  function renderOutboundWarning(row){
    var ratio=Number(row.amountMom),warn=row.amountMom!==null&&row.amountMom!==undefined&&Number.isFinite(ratio)&&Math.abs(ratio)>.15;
    return warn?'<span class="outbound-city-warning"><i class="outbound-city-warning-icon" aria-hidden="true"></i>预警</span>':'';
  }
  function renderOutboundMaterialDetail(info,detail){
    var rows=detail&&Array.isArray(detail.rows)?detail.rows:[];
    var chart=document.getElementById('outbound-city-chart');
    var chartSub=document.getElementById('outbound-city-chart-sub');
    var chartTitle=document.getElementById('outbound-city-chart-title');
    var tableTitle=document.getElementById('outbound-city-table-title');
    var provinceSelect=document.getElementById('outbound-province-select');
    var nameHead=document.getElementById('outbound-city-name-head');
    var tableBody=document.getElementById('outbound-city-table-body');
    chart.classList.remove('outbound-device-chart');
    chartTitle.textContent='各省份出库金额';
    nameHead.textContent='地级市';
    chartSub.textContent=materialFilterLabel()+' TOP10 · 单位：万元 · 点击省份查看地级市';
    var provinceMap={};
    rows.forEach(function(row){
      var province=row.province||'未标注';
      if(!provinceMap[province])provinceMap[province]={province:province,amount:0,previousAmount:0};
      provinceMap[province].amount+=Number(row.amount)||0;
      provinceMap[province].previousAmount+=Number(row.previousAmount)||0;
    });
    var provinceRows=Object.keys(provinceMap).map(function(key){
      var item=provinceMap[key],mom=item.previousAmount?item.amount/item.previousAmount-1:null;
      return {province:item.province,amount:item.amount,previousAmount:item.previousAmount,amountMom:mom,share:0};
    });

          '<td class="num '+v.qdCls+'">'+v.qd+'</td>'+
          '<td class="num">'+v.stock+'</td>'+
          '<td class="num">'+v.digest+'</td>'+
          '<td class="num"><span class="urg-pill '+urgCls+'">'+urg+'</span></td>'+
          '</tr>';
      });
    }
    table+='</tbody></table></div>';
    return toolbar+table;
  }
  function applyMaterialInventoryFilter(){
    var input=document.getElementById('material-inventory-search');
    var q=input?String(input.value||'').trim().toLowerCase():'';
    var rows=document.querySelectorAll('.material-inventory-table tbody tr[data-name]');
    rows.forEach(function(row){
      var name=(row.getAttribute('data-name')||'').toLowerCase();
      var code=(row.getAttribute('data-code')||'').toLowerCase();
      var matchSearch=!q||name.indexOf(q)>=0||code.indexOf(q)>=0;
      row.classList.toggle('hidden',!matchSearch);
    });
  }
  function sortMaterialInventoryTable(th){
    if(!th)return;
    var dir=th.getAttribute('data-sort-dir')==='asc'?'desc':'asc';
    var table=th.closest('table');
    if(!table)return;
    var ths=table.querySelectorAll('thead th.sortable');
    ths.forEach(function(other){
      if(other!==th){
        other.setAttribute('data-sort-dir','');
        var ind=other.querySelector('.sort-indicator');if(ind)ind.textContent='⇅';
      }
    });
    th.setAttribute('data-sort-dir',dir);
    var ind=th.querySelector('.sort-indicator');if(ind)ind.textContent=dir==='asc'?'▲':'▼';
    var tbody=table.querySelector('tbody');
    if(!tbody)return;
    var rows=Array.prototype.slice.call(tbody.querySelectorAll('tr[data-this-out]'));
    rows.sort(function(a,b){
      var av=parseFloat(a.getAttribute('data-this-out'));
      var bv=parseFloat(b.getAttribute('data-this-out'));
      if(isNaN(av)&&isNaN(bv))return 0;
      if(isNaN(av))return 1;
      if(isNaN(bv))return-1;
      return dir==='asc'?av-bv:bv-av;
    });
    var frag=document.createDocumentFragment();
    rows.forEach(function(r){frag.appendChild(r);});
    tbody.appendChild(frag);
  }
  function renderMaterialModalBody(info,dim){
    var body=document.getElementById('material-modal-body');
    var sub=document.getElementById('material-modal-sub');
    var span=document.getElementById('material-modal-month-span');
    sub.textContent=materialSubText(info);
    span.textContent=materialMonthSpanText(info,dim);
    // 维度消化天数解释 hint（弹窗顶端 sub 下方，dim 切换时自动更新）
    var hint=document.getElementById('material-modal-dim-hint');
    if(!hint){
      hint=document.createElement('div');
      hint.id='material-modal-dim-hint';
      hint.className='material-modal-dim-hint';
      sub.parentNode.appendChild(hint);
    }
    hint.innerHTML=materialDimHintText(dim);
    if(!info.detail||!Array.isArray(info.detail.items)||!info.detail.items.length){
      body.innerHTML='<div class="material-modal-empty">'+info.month+'月暂无物料库存数据，请先运行一键更新物料看板。</div>';
    }else{
      body.innerHTML=buildMaterialInventoryTable(dim,info);
      // 搜索输入
      var input=document.getElementById('material-inventory-search');
      if(input)input.addEventListener('input',applyMaterialInventoryFilter);
      var reset=document.getElementById('material-inventory-reset');
      if(reset)reset.addEventListener('click',function(){
        if(input)input.value='';
        applyMaterialInventoryFilter();
      });
      // 表头本周/本月出库数排序
      var sortHeader=body.querySelector('.material-inventory-table th.sortable');
      if(sortHeader)sortHeader.addEventListener('click',function(){sortMaterialInventoryTable(sortHeader);});
    }
  }
  function openMaterialModal(){
    var info=getActiveMaterialDetail();
    renderMaterialModalBody(info,materialModalDim);
    document.getElementById('material-modal-mask').classList.add('open');
    document.body.style.overflow='hidden';
  }
  function refreshMaterialModalIfOpen(){
    var mask=document.getElementById('material-modal-mask');
    if(!mask||!mask.classList.contains('open'))return;
    var info=getActiveMaterialDetail();
    renderMaterialModalBody(info,materialModalDim);
  }
  function closeMaterialModal(){
    document.getElementById('material-modal-mask').classList.remove('open');
    document.body.style.overflow='';
  }
  var deviceWeeklyCard=document.getElementById('device-weekly-card');
  if(deviceWeeklyCard){
    deviceWeeklyCard.addEventListener('click',openDeviceModal);
    deviceWeeklyCard.addEventListener('keydown',function(event){if(event.key==='Enter'||event.key===' '){event.preventDefault();openDeviceModal();}});
  }
  document.getElementById('device-modal-close').addEventListener('click',closeDeviceModal);
  document.getElementById('device-modal-mask').addEventListener('click',function(event){if(event.target===this)closeDeviceModal();});
  document.addEventListener('keydown',function(event){if(event.key==='Escape')closeDeviceModal();});
  document.getElementById('device-modal-dim-toggle').addEventListener('click',function(e){
    var btn=e.target.closest('.dim-btn');
    if(!btn)return;
    var dim=btn.getAttribute('data-dim');
    if(dim===deviceModalDim)return;
    deviceModalDim=dim;
    this.querySelectorAll('.dim-btn').forEach(function(b){b.classList.toggle('active',b===btn);});
    refreshDeviceModalIfOpen();
  });
  document.getElementById('device-modal-body').addEventListener('click',function(e){
    var toggle=e.target.closest('[data-cat-toggle]');
    if(!toggle)return;
    e.preventDefault();
    var key=toggle.getAttribute('data-cat-toggle');
    var tbody=toggle.closest('tbody.cat-group');
    if(!tbody)return;
    if(tbody.classList.contains('cat-collapsed')){
      tbody.classList.remove('cat-collapsed');
      toggle.textContent='▼';
      deviceModalExpanded[key]=true;
    }else{
      tbody.classList.add('cat-collapsed');
      toggle.textContent='▶';
      deviceModalExpanded[key]=false;
    }
  });
  var materialWeeklyCard=document.getElementById('material-weekly-card');
  if(materialWeeklyCard){
    materialWeeklyCard.addEventListener('click',openMaterialModal);
    materialWeeklyCard.addEventListener('keydown',function(event){if(event.key==='Enter'||event.key===' '){event.preventDefault();openMaterialModal();}});
  }
  document.getElementById('material-modal-close').addEventListener('click',closeMaterialModal);
  document.getElementById('material-modal-mask').addEventListener('click',function(event){if(event.target===this)closeMaterialModal();});
  document.addEventListener('keydown',function(event){if(event.key==='Escape')closeMaterialModal();});
  document.getElementById('material-modal-dim-toggle').addEventListener('click',function(e){
    var btn=e.target.closest('.dim-btn');
    if(!btn)return;
    var dim=btn.getAttribute('data-dim');
    if(dim===materialModalDim)return;
    materialModalDim=dim;
    this.querySelectorAll('.dim-btn').forEach(function(b){b.classList.toggle('active',b===btn);});
    refreshMaterialModalIfOpen();
  });
  inventoryQuantityLink.addEventListener('click',function(event){event.preventDefault();openOutboundDetailModal();});
  document.getElementById('outbound-city-chart').addEventListener('click',function(event){
    var button=event.target.closest('[data-province]');
    if(!button)return;
    outboundProvinceFilter=button.getAttribute('data-province')||'';
    renderOutboundDetailModal();
  });
  document.getElementById('outbound-province-select').addEventListener('change',function(){
    outboundProvinceFilter=this.value||'';
    renderOutboundDetailModal();
  });
  if(ganttPriorityFilter)initializeDevelopmentFilters();
  initializeMaterialFilters();
  bindDailyOutboundTrend();
  var currentMonth=new Date().getMonth()+1;
  if(currentMonth<1||currentMonth>12)currentMonth=10;
  updateMonth(currentMonth);
  document.addEventListener('dashboardmonthchange',refreshDeviceModalIfOpen);
  document.addEventListener('dashboardmonthchange',refreshMaterialModalIfOpen);
  document.addEventListener('dashboardmonthchange',refreshOutboundDetailModalIfOpen);
  renderOutboundDetailModal();
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(redraw);
  var resizeTimer;window.addEventListener('resize',function(){clearTimeout(resizeTimer);resizeTimer=setTimeout(redraw,120);});
})();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('./sw.js').catch(function (error) {
      console.warn('离线缓存注册失败', error);
    });
  });
}
</script>
