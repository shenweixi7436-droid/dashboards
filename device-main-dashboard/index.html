<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>设备数据分析看板</title>
<style>
@font-face{font-family:'GOTHAMRND-BOLD';src:url('assets/fonts/gotham-rounded-bold.f6281701cdb9.woff2') format('woff2');font-display:swap}
@font-face{font-family:'HKYuan-W7';src:url('assets/fonts/hk-yuan-w7.a0f4d903956d.woff2') format('woff2');font-display:swap}
@font-face{font-family:'HKYuan-W8';src:url('assets/fonts/hk-yuan-w7.a0f4d903956d.woff2') format('woff2');font-display:swap}
@font-face{font-family:'HKYuan-W9';src:url('assets/fonts/hk-yuan-w7.a0f4d903956d.woff2') format('woff2');font-display:swap}
:root{--surface:#fff;--tiger-yellow:#ffcc00;--tiger-brown:#632c16;--tiger-red:#d93924;--text:#632c16;--muted:rgba(99,44,22,.68);--border:rgba(99,44,22,.16);--shadow:0 4px 6px -1px rgba(15,23,42,.05),0 2px 4px -2px rgba(15,23,42,.05)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:#f1f5f9;color:var(--text);font-family:'GOTHAMRND-BOLD','HKYuan-W7',sans-serif;-webkit-font-smoothing:antialiased}
#topbar{height:64px;padding:0 28px;display:flex;align-items:center;background:rgba(255,255,255,.96);border-bottom:1px solid var(--border);box-shadow:var(--shadow)}
.brand{display:flex;align-items:center;gap:12px}
.brand-icon{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:#fff;background:var(--tiger-red);box-shadow:0 4px 10px rgba(217,57,36,.24)}
.brand-icon svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.brand-name{font-family:'GOTHAMRND-BOLD','HKYuan-W9',sans-serif;font-size:17px;font-weight:400;letter-spacing:-.02em}
.brand-sub{margin-top:2px;color:rgba(99,44,22,.62);font-family:'GOTHAMRND-BOLD','HKYuan-W7',sans-serif;font-size:11px;letter-spacing:.03em}
main{width:min(1440px,100%);margin:0 auto;padding:24px 28px 48px;display:flex;flex-direction:column;gap:24px}
.dashboard-filters{padding:16px 20px 14px;background:rgba(255,250,240,.94);border:1px solid var(--border);border-top:2px solid var(--tiger-yellow);border-radius:12px;box-shadow:var(--shadow)}
.dashboard-filter-main,.dashboard-filter-options{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.dashboard-filter-main{margin-bottom:12px}
.dashboard-filter-search{flex:1 1 300px;min-width:220px;height:36px;padding:0 12px;border:1px solid rgba(99,44,22,.22);border-radius:8px;background:#fff;color:var(--tiger-brown);font:13px 'GOTHAMRND-BOLD','HKYuan-W7',sans-serif;outline:none}
.dashboard-filter-search:focus,.dashboard-filter-select:focus,.dashboard-filter-date:focus{border-color:var(--tiger-red);box-shadow:0 0 0 3px rgba(217,57,36,.12)}
.dashboard-filter-button{height:36px;padding:0 16px;border:1px solid var(--tiger-brown);border-radius:8px;background:var(--tiger-yellow);color:var(--tiger-brown);font:13px 'GOTHAMRND-BOLD','HKYuan-W8',sans-serif;cursor:pointer}
.dashboard-filter-button.secondary{background:#fff;border-color:rgba(99,44,22,.25);font-family:'GOTHAMRND-BOLD','HKYuan-W7',sans-serif}
.dashboard-filter-label{display:flex;align-items:center;gap:7px;color:rgba(99,44,22,.78);font-size:12px}
.dashboard-filter-select,.dashboard-filter-date{height:34px;padding:0 28px 0 10px;border:1px solid rgba(99,44,22,.22);border-radius:8px;background:#fff;color:var(--tiger-brown);font:12px 'GOTHAMRND-BOLD','HKYuan-W7',sans-serif;outline:none}
.dashboard-filter-date{padding-right:8px}
.dashboard-filter-range{display:none;align-items:center;gap:7px;color:rgba(99,44,22,.72);font-size:12px}
.dashboard-filter-range.is-visible{display:flex}
.dashboard-filter-summary{margin-top:10px;color:rgba(99,44,22,.58);font-size:11px}
.kpi-zone{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}
.kpi-card{min-width:0;min-height:188px;position:relative;display:flex;flex-direction:column;justify-content:flex-start;padding:24px 30px;background:var(--tiger-yellow);border:2px solid var(--tiger-brown);border-radius:28px;color:var(--tiger-brown);box-shadow:none}
.kpi-title{min-height:28px;color:var(--tiger-brown);font-family:'GOTHAMRND-BOLD','HKYuan-W8',sans-serif;font-size:22px;font-weight:400;line-height:1.25}
.kpi-value{margin-top:18px;color:var(--tiger-brown);font-family:'GOTHAMRND-BOLD','HKYuan-W7',sans-serif;font-size:32px;line-height:1;font-weight:400;font-variant-numeric:tabular-nums}
.channel-share-value{display:flex;flex-direction:column;gap:4px;font-size:18px;line-height:1.12;white-space:nowrap}
.channel-share-row{display:flex;align-items:baseline;gap:8px;min-width:0}
.channel-share-name{min-width:0;overflow:hidden;text-overflow:ellipsis}
.channel-share-percent{font-size:18px;font-variant-numeric:tabular-nums}
.kpi-meta{margin-top:12px;color:var(--tiger-brown);font-size:13px;line-height:1.45}
.dashboard-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:480px 620px;gap:20px}
.panel{min-width:0;min-height:0;height:100%;background:rgba(255,255,255,.72);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column}
.panel-header{padding:16px 20px 12px;border-bottom:1px solid rgba(99,44,22,.12);background:rgba(255,250,240,.9);flex:0 0 auto}
.panel-header h2{font-family:'GOTHAMRND-BOLD','HKYuan-W8',sans-serif;font-size:18px;font-weight:400;line-height:1.25}
.panel-header p{margin-top:5px;color:var(--muted);font-size:11px;line-height:1.35}
.panel-body{min-height:0;flex:1;padding:12px 16px}
.device-chart-body{padding:8px 12px 12px}
.device-daily-chart-wrap{position:relative;height:100%;min-height:260px}
#device-daily-chart{display:block;width:100%;height:100%;cursor:crosshair}
.chart-canvas-tooltip{position:absolute;display:none;pointer-events:none;padding:8px 10px;background:var(--tiger-brown);color:#fff;border-radius:8px;font-size:11px;line-height:1.35;box-shadow:0 6px 16px rgba(99,44,22,.22);white-space:nowrap;transform:translate(-50%,-110%)}
.device-category-scroll,.device-province-scroll,.device-detail-scroll{min-height:0;overflow:auto;height:100%;padding-right:4px}
.category-column-header{position:sticky;top:0;z-index:2;display:grid;grid-template-columns:minmax(70px,1fr) 92px 56px;gap:8px;align-items:center;padding:7px 9px;background:#f3eee9;border-bottom:1px solid rgba(99,44,22,.16);color:var(--muted);font-size:10px}
.category-column-header span:nth-child(n+2){text-align:right}
.category-group{padding:7px 0 4px;border-bottom:1px solid rgba(99,44,22,.1)}
.category-group:last-child{border-bottom:0}
.category-group-title{display:grid;grid-template-columns:minmax(70px,1fr) 92px 56px;gap:8px;align-items:center;margin-bottom:5px;padding:7px 9px;background:var(--tiger-brown);border-radius:4px;color:#fff;font-size:12px}
.category-group-title strong{font-weight:400}
.category-group-total,.category-group-mom{text-align:right;color:#fff;font-size:11px;font-variant-numeric:tabular-nums;white-space:nowrap}
.category-group-title .category-group-mom.positive{color:#c9f7d8}.category-group-title .category-group-mom.negative{color:#ffd0c9}.category-group-title .category-group-mom.neutral{color:rgba(255,255,255,.7)}
.category-row{display:grid;grid-template-columns:minmax(70px,1fr) 92px 56px;gap:8px;align-items:center;padding:5px 9px;font-size:11px}
.category-row-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.category-row-amount{font-variant-numeric:tabular-nums;white-space:nowrap}
.category-row-mom{font-variant-numeric:tabular-nums;white-space:nowrap;min-width:50px;text-align:right}
.positive{color:#138a43}.negative{color:var(--tiger-red)}.neutral{color:var(--muted)}
.province-rank-row{display:grid;grid-template-columns:76px minmax(70px,1fr) auto auto;gap:8px;align-items:center;padding:7px 0;font-size:11px}
.province-rank-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.province-rank-track{height:8px;background:rgba(99,44,22,.08);border-radius:6px;overflow:hidden}
.province-rank-bar{height:100%;background:var(--tiger-yellow);border-radius:6px}
.province-rank-amount,.province-rank-mom{font-variant-numeric:tabular-nums;white-space:nowrap}
.empty-state{height:100%;display:grid;place-items:center;color:var(--muted);font-size:13px}
.device-detail-table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:10px}
.device-detail-table th,.device-detail-table td{padding:7px 6px;border-bottom:1px solid rgba(99,44,22,.1);text-align:left;vertical-align:middle}
.device-detail-table th{position:sticky;top:0;z-index:1;background:#f8f4ee;color:var(--muted);font-weight:400;white-space:nowrap}
.device-detail-table th:nth-child(1){width:14%}.device-detail-table th:nth-child(2){width:15%}.device-detail-table th:nth-child(3){width:27%}.device-detail-table th:nth-child(4){width:9%;text-align:right}.device-detail-table th:nth-child(5){width:14%;text-align:right}.device-detail-table th:nth-child(6){width:10%;text-align:right}.device-detail-table th:nth-child(7){width:11%;text-align:right}
.device-detail-table td:nth-child(n+4){text-align:right;font-variant-numeric:tabular-nums}
.device-detail-table .detail-group-row td{background:rgba(255,204,0,.16);font-family:'GOTHAMRND-BOLD','HKYuan-W7',sans-serif}
.device-detail-table .detail-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.device-detail-table .detail-indent{padding-left:14px;color:var(--muted)}
@media(max-width:1000px){.kpi-zone{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:680px){#topbar{padding:12px 16px;height:auto;min-height:64px}main{padding:16px}.kpi-zone,.dashboard-grid{grid-template-columns:1fr}.dashboard-grid{grid-template-rows:480px 480px 620px 620px}.kpi-card{min-height:150px;padding:22px 24px}}
</style>
</head>
<body>
<header id="topbar">
  <div class="brand">
    <div class="brand-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 19V9m5 10V5m5 14v-7m5 7V3"/></svg></div>
    <div><div class="brand-name">设备数据分析看板</div><div class="brand-sub">Equipment Data Analysis Dashboard</div></div>
  </div>
</header>
<main>
  <section class="dashboard-filters" aria-label="设备数据筛选">
    <div class="dashboard-filter-main">
      <input class="dashboard-filter-search" id="device-filter-search" type="search" placeholder="搜索设备名称" aria-label="搜索设备名称">
      <button class="dashboard-filter-button" id="device-filter-apply" type="button">查询</button>
      <button class="dashboard-filter-button secondary" id="device-filter-reset" type="button">重置</button>
    </div>
    <div class="dashboard-filter-options">
      <label class="dashboard-filter-label">渠道（C列）
        <select class="dashboard-filter-select" id="device-filter-channel" aria-label="按设备出库明细C列筛选渠道"><option value="">全部渠道</option></select>
      </label>
      <label class="dashboard-filter-label">时间
        <select class="dashboard-filter-select" id="device-filter-time" aria-label="时间筛选">
          <option value="month">本月</option><option value="prev">上月</option><option value="7d">近7天</option><option value="30d">近30天</option><option value="custom">自定义日期</option>
        </select>
      </label>
      <label class="dashboard-filter-label">省份
        <select class="dashboard-filter-select" id="device-filter-province" aria-label="省份筛选"><option value="">全部省份</option></select>
      </label>
      <div class="dashboard-filter-range" id="device-filter-range">
        <label>开始 <input class="dashboard-filter-date" id="device-filter-start" type="date"></label>
        <label>结束 <input class="dashboard-filter-date" id="device-filter-end" type="date"></label>
      </div>
    </div>
    <div class="dashboard-filter-summary" id="device-filter-summary"></div>
  </section>
  <section class="kpi-zone" aria-label="设备数据指标">
    <article class="kpi-card"><h2 class="kpi-title">设备出库量</h2><div class="kpi-value" id="device-outbound-amount">暂无数据</div></article>
    <article class="kpi-card"><h2 class="kpi-title">出库金额增速</h2><div class="kpi-value" id="device-outbound-growth">暂无数据</div></article>
    <article class="kpi-card"><h2 class="kpi-title">渠道占比</h2><div class="kpi-value channel-share-value" id="device-channel-share">暂无数据</div></article>
    <article class="kpi-card"><h2 class="kpi-title">出库省份数</h2><div class="kpi-value" id="device-province-count">暂无数据</div></article>
  </section>
  <section class="dashboard-grid" aria-label="设备数据分析栏目">
    <article class="panel device-panel" aria-labelledby="device-daily-title">
      <header class="panel-header"><h2 id="device-daily-title">每日出库金额趋势</h2><p id="device-daily-subtitle"></p></header>
      <div class="panel-body device-chart-body"><div class="device-daily-chart-wrap"><canvas id="device-daily-chart"></canvas><div class="chart-canvas-tooltip" id="device-daily-tooltip"></div></div></div>
    </article>
    <article class="panel device-panel" aria-labelledby="device-category-title">
      <header class="panel-header"><h2 id="device-category-title">渠道/设备大类金额排行</h2><p>按设备出库明细 C 列渠道、N 列设备大类汇总，显示环比</p></header>
      <div class="panel-body"><div class="device-category-scroll" id="device-category-rank"></div></div>
    </article>
    <article class="panel device-panel" aria-labelledby="device-province-title">
      <header class="panel-header"><h2 id="device-province-title">各省份出库金额</h2><p id="device-province-subtitle">全部省份按出库金额降序排列</p></header>
      <div class="panel-body"><div class="device-province-scroll" id="device-province-rank"></div></div>
    </article>
    <article class="panel device-panel" aria-labelledby="device-detail-title">
      <header class="panel-header"><h2 id="device-detail-title">设备出库明细</h2><p>按品牌、设备大类和设备名称汇总，金额单位：万元</p></header>
      <div class="panel-body"><div class="device-detail-scroll"><table class="device-detail-table" id="device-detail-table"><thead><tr><th>设备品牌</th><th>设备大类</th><th>设备名称</th><th>发货量</th><th>发货金额（万元）</th><th>数量环比</th><th>金额环比（万元）</th></tr></thead><tbody></tbody></table></div></div>
    </article>
  </section>
</main>
<script src="assets/data/device_filter_data.js"></script>
<script>
(function(){
  var data=window.DEVICE_FILTER_DATA||{rows:[],channels:[]};
  var time=document.getElementById('device-filter-time'),range=document.getElementById('device-filter-range'),summary=document.getElementById('device-filter-summary'),search=document.getElementById('device-filter-search'),channel=document.getElementById('device-filter-channel'),province=document.getElementById('device-filter-province'),start=document.getElementById('device-filter-start'),end=document.getElementById('device-filter-end');
  var amountEl=document.getElementById('device-outbound-amount'),growthEl=document.getElementById('device-outbound-growth'),shareEl=document.getElementById('device-channel-share'),provinceEl=document.getElementById('device-province-count');
  var dailyCanvas=document.getElementById('device-daily-chart'),dailyTooltip=document.getElementById('device-daily-tooltip'),dailyPoints=[];
  function pad(value){return String(value).padStart(2,'0');}
  function dateText(date){return date.getFullYear()+'-'+pad(date.getMonth()+1)+'-'+pad(date.getDate());}
  function esc(value){return String(value==null?'':value).replace(/[&<>"']/g,function(ch){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch];});}
  function monthText(){var now=new Date();return now.getFullYear()+'-'+pad(now.getMonth()+1);}
  function monthWindow(month){var m=Number(month);if(!Number.isFinite(m))m=new Date().getMonth()+1;var startDate=new Date(2026,m-1,1),endDate=new Date(2026,m,1);return {start:dateText(startDate),end:dateText(endDate)};}
  function shift(value,days){var date=new Date(value+'T00:00:00');date.setDate(date.getDate()+days);return dateText(date);}
  function daysIn(windowRange){return Math.max(1,Math.round((new Date(windowRange.end+'T00:00:00')-new Date(windowRange.start+'T00:00:00'))/86400000));}
  function previousWindow(windowRange){var days=daysIn(windowRange);return {start:shift(windowRange.start,-days),end:windowRange.start};}
  function filterWindow(){var month=new Date().getMonth()+1,mode=time.value;if(mode==='prev')return monthWindow(month-1);if(mode==='custom'&&start.value&&end.value)return {start:start.value,end:shift(end.value,1)};var base=monthWindow(month);if(mode==='7d'||mode==='30d'){var last='';data.rows.forEach(function(row){if(row.d>=base.start&&row.d<base.end&&row.d>last)last=row.d;});if(!last)last=shift(base.end,-1);return {start:shift(last,mode==='7d'?-6:-29),end:shift(last,1)};}return base;}
  function rowsFor(windowRange){var query=search.value.trim().toLowerCase(),channelValue=channel.value,provinceValue=province.value;return data.rows.filter(function(row){return row.d>=windowRange.start&&row.d<windowRange.end&&(!query||String(row.n).toLowerCase().indexOf(query)>=0)&&(!channelValue||row.c===channelValue)&&(!provinceValue||row.p===provinceValue);});}
  function total(rows){return rows.reduce(function(sum,row){return sum+(Number(row.a)||0);},0);}
  function quantity(rows){return rows.reduce(function(sum,row){return sum+(Number(row.q)||0);},0);}
  function moneyWan(value){return (Number(value||0)/10000).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2})+'万元';}
  function amountNumber(value){return (Number(value||0)/10000).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});}
  function qtyNumber(value){return Number(value||0).toLocaleString('zh-CN',{minimumFractionDigits:0,maximumFractionDigits:2});}
  function momText(current,previous){if(!previous)return '—';var value=current/previous-1;return (value>=0?'+':'')+(value*100).toFixed(1)+'%';}
  function deltaText(current,previous,unit){var value=current-previous;if(!previous&&value===0)return '—';return (value>0?'+':'')+value.toLocaleString('zh-CN',{minimumFractionDigits:unit==='万元'?2:0,maximumFractionDigits:unit==='万元'?2:2})+(unit||'');}
  function deltaMoneyWan(current,previous){var value=(current-previous)/10000;if(!previous&&value===0)return '—';return (value>0?'+':'')+value.toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});}
  function momClass(current,previous){if(!previous)return 'neutral';return current>=previous?'positive':'negative';}
  function renderOptions(){
    channel.innerHTML='<option value="">全部渠道</option>'+data.channels.map(function(value){return '<option value="'+esc(value)+'">'+esc(value==='？'?'其他渠道':value)+'</option>';}).join('');
    var provinces={};data.rows.forEach(function(row){provinces[row.p]=true;});
    province.innerHTML='<option value="">全部省份</option>'+Object.keys(provinces).sort(function(a,b){return a.localeCompare(b,'zh-CN');}).map(function(value){return '<option value="'+esc(value)+'">'+esc(value)+'</option>';}).join('');
  }
  function aggregate(rows,keyFn){var result={};rows.forEach(function(row){var key=keyFn(row),entry=result[key]||(result[key]={amount:0,quantity:0});entry.amount+=Number(row.a)||0;entry.quantity+=Number(row.q)||0;});return result;}
  function renderDaily(rows,windowRange){
    var byDate=aggregate(rows,function(row){return row.d;}),dates=Object.keys(byDate).sort(),subtitle=document.getElementById('device-daily-subtitle');subtitle.textContent=(windowRange.start+' 至 '+shift(windowRange.end,-1))+' · 按 K 列下单日期汇总 · 单位：万元';
    dailyPoints=[];var rect=dailyCanvas.getBoundingClientRect(),width=Math.max(320,Math.round(rect.width)),height=Math.max(220,Math.round(rect.height)),dpr=window.devicePixelRatio||1;dailyCanvas.width=width*dpr;dailyCanvas.height=height*dpr;var ctx=dailyCanvas.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,width,height);
    if(!dates.length){ctx.fillStyle='rgba(99,44,22,.62)';ctx.font='13px HKYuan-W7, sans-serif';ctx.textAlign='center';ctx.fillText('暂无数据',width/2,height/2);return;}
    var values=dates.map(function(date){return byDate[date].amount/10000;}),max=Math.max.apply(Math,values.concat([1])),left=42,right=12,top=18,bottom=28,plotW=width-left-right,plotH=height-top-bottom,step=dates.length>1?plotW/(dates.length-1):plotW/2;
    ctx.strokeStyle='rgba(99,44,22,.13)';ctx.lineWidth=1;ctx.fillStyle='rgba(99,44,22,.65)';ctx.font='10px HKYuan-W7, sans-serif';ctx.textAlign='right';for(var grid=0;grid<=4;grid++){var gy=top+plotH-grid*plotH/4;ctx.beginPath();ctx.moveTo(left,gy);ctx.lineTo(width-right,gy);ctx.stroke();ctx.fillText((max*grid/4).toFixed(0),left-6,gy+3);}
